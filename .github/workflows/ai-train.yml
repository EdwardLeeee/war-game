# D-086 B (war-game-ai, docs/research/2026-10-ai-nn.md): training the hard AI's small network on GitHub's
# machines, CPU only. Started by hand only: from the Actions tab (workflow_dispatch, once this file is on
# main), or by war-game-ai pushing a branch ai/train-* whose sim/src/ai/learn/run.json holds the same
# settings as the inputs below (ceo 2026-10-19), so training can start before this is merged. One training at a time (its own concurrency group); at most 16
# jobs at once, 4 of the 20 runners kept free (the user 2026-11-21, D-160), so Pages, Client, Sim and other work keep running. A job stops itself before GitHub's 6-hour
# limit and leaves a checkpoint as an artifact (kept 14 days, never committed); the next run goes on from it
# (from_run). The last job adds up the runner hours of the run.
#   dryrun  cores and games an hour
#   record  hard's inputs and what it did, in AI-against-AI games (train-record), for looking into
#   es      evolution strategies, one island per job (train-es-<n>), from the network that plays exactly as hard
#           (from_run: an es run to go on from)
#   eval    networks against hard, normal and the late group (nets: files in the branch; or from_run, net_artifact)
#   exam    D-147: search the scripted player's plays for examiners that beat hard (src/ai/learn/exam.ts search), one
#           search per job (islands), each its own seeds
#   examcheck  D-147: the best of each kind from an exam run (from_run), on fresh seeds (exam.ts check), split over the jobs
#   chaintest  D-147 PR A: one segment of the chain for its trial, dryrun again and again until `hours`; gives way (D-123)
#   auto    D-147 PR B: a segment of the automatic exam (src/ai/learn/exam-auto.ts): each job plays its share of the games
#           the exam state needs (islands: jobs), then the merge job adds them up, decides and keeps the state (artifact
#           ai-train-state-<config name>, 90 days). The config: args --config FILE (under sim/), else
#           src/ai/learn/auto-config.json. The chain's segments run this mode.
#   dispatch   D-147: the dispatcher alone (as the schedule runs it), its `args` for the trial (lower caps only)
#
# D-147 (ceo 2026-11-21; A2: the chain goes on by itself) — the chain that trains with nobody watching:
#   a segment (at most an hour) ends with the dispatch job, which starts the next segment; every 30 minutes the schedule
#   runs the dispatch job alone too (plan, train and hours skipped), to start the chain again when it stopped (a segment
#   gave way or failed; GitHub may start a schedule late or not at all: a hand dispatch, mode=dispatch, does the same).
#   The dispatch job is the only job with actions: write and uses no secret; .github/ai-train/dispatch.py says when it
#   starts a segment, how it pauses itself and how the pause is lifted. In short, nothing unless: AI_TRAIN is "on"; the
#   hours stay within 5,000 in all (no cap a day: the user, D-160), and at most 192 segments a day (a brake on the rate),
#   all from the API; the chain is not paused; no other AI train run is running or waiting, no job of another workflow
#   waits (D-123); a segment takes the runners free with 4 of the 20 kept, at most 16 (none free: no segment); on a
#   segment's tail, that segment trained properly.
#   Taken over (PR B, docs/research/2026-11-train-chain-handback.md): when only the runners are taken, a wait run of
#   ai-train-wait.yml waits on the environment ai-train-wait's timer and decides again; without that environment, the schedule.
#   To stop: set AI_TRAIN to "off" (no next segment; the one running ends within its hour), or cancel the run in the
#   Actions tab: that stops at once and pauses the chain until the user says to go on (AI_TRAIN_RESUME).
#   Any other AI train run started while a segment waits in the ai-train group cancels the waiting one (GitHub keeps one
#   pending run a group), which pauses the chain too: start no other AI train run while AI_TRAIN is on.
name: AI train
# Only the dispatcher's runs get a name of their own: a run's `name` in the API is its run-name, and exam.ts tells AI train
# runs by name; every other run is named "AI train" as before.
run-name: "${{ (github.event_name == 'schedule' && vars.AI_TRAIN != 'on') && 'AI train: dispatch (off)' || ((github.event_name == 'schedule' || inputs.mode == 'dispatch') && 'AI train: dispatch' || 'AI train') }}"

on:
  # D-147: the dispatcher, every 30 minutes (off the hour, when GitHub's schedules crowd).
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: dryrun, record, es, eval, exam, examcheck, chaintest, auto or dispatch
        type: choice
        options: [dryrun, record, es, eval, exam, examcheck, chaintest, auto, dispatch]
        default: dryrun
      from_run:
        description: The run whose artifacts this one starts from (es, eval)
        default: ""
      islands:
        description: "es, exam: jobs, each its own search; examcheck, auto: jobs the work is split over (at most 16)"
        default: "8"
      generations:
        description: "es: generations per job at most"
        default: "20"
      hours:
        description: Hours a job plays before it saves and stops
        default: "5.5"
      games:
        description: "record: games; eval: games against hard on each map; examcheck: games each plan"
        default: "400"
      config:
        description: "es: settings over ES_DEFAULTS (JSON)"
        default: "{}"
      net_artifact:
        description: "eval: the artifact of from_run with net.json (or bc.json)"
        default: train-es-0
      from_runs:
        description: "examcheck: more runs to read (comma-separated ids: searches, and earlier checks for --skip-checked)"
        default: ""
      args:
        description: "more options for the mode's program, split on spaces (exam, examcheck: exam.ts's; dispatch: --day-cap H --total-cap H --segment-hours H --day-segments N, each only lower, --chain-start T only earlier, --api-fail; for the segment: --fail, --short, --yield)"
        default: ""
  push:
    branches: ["ai/train-*"]

permissions:
  contents: read
  actions: read

# Training runs one at a time in ai-train; the dispatcher in a group of its own, so neither ever cancels or holds up the other.
concurrency:
  group: ${{ (github.event_name == 'schedule' || inputs.mode == 'dispatch') && 'ai-train-dispatch' || 'ai-train' }}
  cancel-in-progress: false

jobs:
  # D-147: decides whether to start the next segment, and starts it (.github/ai-train/dispatch.py; see the top of this
  # file). The only job with actions: write; it uses no secret.
  dispatch:
    needs: [plan, train, merge]
    # Three ways, and never once the run is cancelled (!cancelled(): with a status function in it, no success() is
    # added; always() would run after a cancel too):
    #   the schedule with the switch on (plan and train skipped; off, this job is skipped too: "AI train: dispatch (off)");
    #   a hand dispatch, mode=dispatch;
    #   the tail of a segment: the run started by the dispatcher (github-actions[bot], also as triggering actor), its first
    #   attempt (a Re-run is not chained), on main, the switch on now, the training jobs and the merge all succeeded.
    if: >-
      github.repository == 'EdwardLeeee/war-game' && !cancelled() && (
      (github.event_name == 'schedule' && vars.AI_TRAIN == 'on') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'dispatch') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'auto' && needs.train.result == 'success' && needs.merge.result == 'success' &&
      github.actor == 'github-actions[bot]' && github.triggering_actor == 'github-actions[bot]' &&
      github.run_attempt == '1' && github.ref == 'refs/heads/main' && vars.AI_TRAIN == 'on'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/ai-train
          persist-credentials: false
      - name: Decide and dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REPO_ID: ${{ github.repository_id }}
          REF: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          AI_TRAIN: ${{ vars.AI_TRAIN }}
          AI_TRAIN_RESUME: ${{ vars.AI_TRAIN_RESUME }}
          ARGS: ${{ inputs.args }}
        run: python3 .github/ai-train/dispatch.py
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-train-ledger
          path: ledger/
          retention-days: 90
          if-no-files-found: ignore

  # The settings: the inputs, or on a push the branch's sim/src/ai/learn/run.json (the same names).
  plan:
    if: github.event_name != 'schedule' && inputs.mode != 'dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.p.outputs.mode }}
      from_run: ${{ steps.p.outputs.from_run }}
      islands: ${{ steps.p.outputs.islands }}
      generations: ${{ steps.p.outputs.generations }}
      hours: ${{ steps.p.outputs.hours }}
      games: ${{ steps.p.outputs.games }}
      config: ${{ steps.p.outputs.config }}
      net_artifact: ${{ steps.p.outputs.net_artifact }}
      args: ${{ steps.p.outputs.args }}
      nets: ${{ steps.p.outputs.nets }}
      from_runs: ${{ steps.p.outputs.from_runs }}
    steps:
      - if: github.event_name == 'push'
        uses: actions/checkout@v7
      - id: p
        env:
          EVENT: ${{ github.event_name }}
          INPUTS: ${{ toJSON(inputs) }}
        run: |
          if [ "$EVENT" = "push" ]; then
            f=sim/src/ai/learn/run.json
            [ -f "$f" ] || { echo "a push to ai/train-* needs $f" >&2; exit 1; }
            S=$(jq -c . "$f")
          else
            S="$INPUTS"
          fi
          get() { echo "$S" | jq -r --arg k "$1" --arg d "$2" '.[$k] // $d | if type == "string" then . else tojson end'; }
          mode=$(get mode dryrun)
          case "$mode" in dryrun|record|es|eval|exam|examcheck|chaintest|auto) ;; *) echo "mode $mode" >&2; exit 1 ;; esac
          islands=$(get islands 8)
          n=1
          if [ "$mode" = "es" ] || [ "$mode" = "exam" ] || [ "$mode" = "examcheck" ] || [ "$mode" = "chaintest" ] || [ "$mode" = "auto" ]; then n=$(( islands < 1 ? 1 : islands > 16 ? 16 : islands )); fi
          # eval: "nets" lists networks in the branch (paths under sim/, "none": hard itself), one job each, at most 8.
          nets=$(echo "$S" | jq -c '.nets // []')
          k=$(echo "$nets" | jq 'length')
          if [ "$mode" = "eval" ] && [ "$k" -gt 0 ]; then n=$(( k > 8 ? 8 : k )); fi
          {
            echo "mode=$mode"
            echo "from_run=$(get from_run '')"
            echo "islands=$(seq -s, 0 $((n - 1)) | sed 's/^/[/; s/$/]/')"
            echo "generations=$(get generations 20)"
            echo "hours=$(get hours 5.5)"
            echo "games=$(get games 400)"
            echo "config=$(get config '{}')"
            echo "net_artifact=$(get net_artifact train-es-0)"
            echo "args=$(get args '')"
            echo "nets=$nets"
            # examcheck: run.json "from_runs" lists several exam runs (D-147: a search dispatched more than once).
            echo "from_runs=$(echo "$S" | jq -r '(.from_runs // "") | if type == "array" then map(tostring) | join(",") else tostring end')"
          } >> "$GITHUB_OUTPUT"
          echo "設定：$(echo "$S" | jq -c .)" >> "$GITHUB_STEP_SUMMARY"

  train:
    needs: plan
    name: ${{ needs.plan.outputs.mode }} (${{ matrix.island }})
    runs-on: ubuntu-latest
    # D-147: a chain segment is ended within its hour whatever happens (chaintest, auto: the job stops itself before).
    # PR B's trial: chaintest --hang waits past a 3-minute limit, to see how GitHub reports a job it ends at its limit.
    timeout-minutes: ${{ contains(needs.plan.outputs.args, '--hang') && 3 || ((needs.plan.outputs.mode == 'chaintest' || needs.plan.outputs.mode == 'auto') && 70 || 355) }}
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        island: ${{ fromJSON(needs.plan.outputs.islands) }}
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: The start (from_run)
        if: needs.plan.outputs.from_run != ''
        uses: actions/download-artifact@v7
        with:
          run-id: ${{ needs.plan.outputs.from_run }}
          github-token: ${{ github.token }}
          path: from
      - name: The exam runs (from_runs)
        if: needs.plan.outputs.from_runs != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS: ${{ needs.plan.outputs.from_runs }}
        run: |
          IFS=, read -ra ids <<< "$RUNS"
          for id in "${ids[@]}"; do gh run download "$id" --repo "$GITHUB_REPOSITORY" --dir "${GITHUB_WORKSPACE}/from/$id"; done
      # D-147 PR B: the exam state this segment plays for (the merge job reads the same one).
      - name: Exam state
        id: es
        if: needs.plan.outputs.mode == 'auto'
        env:
          GH_TOKEN: ${{ github.token }}
          ARGS: ${{ needs.plan.outputs.args }}
        run: |
          C=$(echo " $ARGS " | sed -n 's/.* --config \([^ ]*\) .*/\1/p')
          "$GITHUB_WORKSPACE/.github/ai-train/exam-state.sh" "${C:-src/ai/learn/auto-config.json}" "$GITHUB_WORKSPACE/state"
      - name: Train
        id: t
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          ISLAND: ${{ matrix.island }}
          HOURS: ${{ needs.plan.outputs.hours }}
          GENERATIONS: ${{ needs.plan.outputs.generations }}
          GAMES: ${{ needs.plan.outputs.games }}
          CONFIG: ${{ needs.plan.outputs.config }}
          NET: ${{ needs.plan.outputs.net_artifact }}
          ARGS: ${{ needs.plan.outputs.args }}
          NETS: ${{ needs.plan.outputs.nets }}
          ISLANDS: ${{ needs.plan.outputs.islands }}
          EXAM_CONFIG: ${{ steps.es.outputs.config }}
          # D-147 (exam.ts, ceo 2026-11-16): it gives way to Pages and to jobs long waiting (D-123), reading the runs.
          YIELD_REPO: ${{ (needs.plan.outputs.mode == 'exam' || needs.plan.outputs.mode == 'examcheck' || needs.plan.outputs.mode == 'auto') && github.repository || '' }}
          AI_TRAIN_RESUME: ${{ vars.AI_TRAIN_RESUME }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          F="${GITHUB_WORKSPACE}/from"
          O="${GITHUB_WORKSPACE}/out"
          # run.json "args": more options for train.ts (eval: --seed), split on spaces.
          T="src/ai/learn/train.ts"
          set -- $ARGS
          # A run with one artifact is unpacked straight into from/, with several each into from/<name>/.
          first() { find "$F" -name "$1" 2>/dev/null | sort | head -1; }
          case "$MODE" in
            dryrun) node $T dryrun --out "$O" "$@" ;;
            record) node $T record --games "$GAMES" --out "$O" "$@" ;;
            es)
              R="$F/train-es-$ISLAND"
              if [ ! -f "$R/state.json" ] && [ "$ISLAND" = "0" ] && [ -f "$F/state.json" ]; then R="$F"; fi
              if [ -f "$R/state.json" ]; then
                node $T es --start "$R/net.json" --resume "$R" --out "$O" --hours "$HOURS" --generations "$GENERATIONS"
              else
                node $T es --seed $((ISLAND + 1)) --config "$CONFIG" --out "$O" --hours "$HOURS" --generations "$GENERATIONS"
              fi ;;
            eval)
              L=$(echo "$NETS" | jq -r ".[$ISLAND] // empty")
              if [ "$L" = "none" ]; then node $T eval --games "$GAMES" --out "$O" "$@"; cat "$O/summary.md" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
              if [ -n "$L" ]; then node $T eval --net "$L" --games "$GAMES" --out "$O" "$@"; cat "$O/summary.md" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
              N="$F/$NET/net.json"
              [ -f "$N" ] || N="$F/$NET/bc.json"
              [ -f "$N" ] || N=$(first net.json)
              [ -n "$N" ] && [ -f "$N" ] || N=$(first bc.json)
              node $T eval --net "$N" --games "$GAMES" --out "$O" "$@" ;;
            # D-147: run.json "args" adds exam.ts's options (--map, --pool, --rounds, --cap, --top, --seed-from, --qualify).
            exam) node src/ai/learn/exam.ts search --seed $((ISLAND + 1)) --hours "$HOURS" --parents-from "$F" --out "$O" "$@" ;;
            # D-147 PR B: this job's share of the exam's games; giving way sets the output `yielded` (exam-auto.ts).
            auto) node src/ai/learn/exam-auto.ts work --state "$GITHUB_WORKSPACE/state/state.json" --config "$EXAM_CONFIG" --island "$ISLAND" --islands "$(echo "$ISLANDS" | jq length)" --hours "$HOURS" --out "$O" --resume "$AI_TRAIN_RESUME" ;;
            examcheck) node src/ai/learn/exam.ts check --from "$F" --games "$GAMES" --shard "$ISLAND" --shards "$(echo "$ISLANDS" | jq length)" --out "$O" "$@" ;;
            # D-147 PR A: a segment of the chain for its trial: dryrun again and again until `hours` (at most 1), giving way
            # (D-123, .github/ai-train/giveway.py): a deployment of the site waiting, or another job waiting 10 minutes or
            # more, judged by the jobs (A2: a run can stay "queued" while all its jobs run). Giving
            # way sets the output `yielded`, so the step 讓位 runs (the dispatcher reads that step, in the API). For A2's
            # trial, in args: --fail fails, --short stops after about 2 minutes, --yield gives way at once.
            chaintest)
              mkdir -p "$O"
              t0=$(date +%s)
              stop=$(( t0 + $(awk -v h="$HOURS" 'BEGIN { if (h > 1) h = 1; print int(h * 3600) }') ))
              why="時間到"
              k=0
              case " $* " in *" --fail "*) echo "--fail（A2 試跑）" >&2; exit 1 ;; esac
              case " $* " in *" --hang "*) echo "--hang（PR B 試跑）：等過 3 分鐘的時限"; sleep 600 ;; esac
              case " $* " in *" --short "*) stop=$(( t0 + 240 )); why="--short（A2 試跑）" ;; esac
              case " $* " in *" --yield "*) stop=0; why="讓位（A2 試跑 --yield）"; echo "yielded=true" >> "$GITHUB_OUTPUT" ;; esac
              while [ $(( $(date +%s) + 120 )) -lt "$stop" ]; do
                q=$(python3 "$GITHUB_WORKSPACE/.github/ai-train/giveway.py")
                if [ -n "$q" ]; then why="讓位：$q"; echo "yielded=true" >> "$GITHUB_OUTPUT"; break; fi
                node $T dryrun --out "$O/$k" > /dev/null
                k=$((k + 1))
              done
              { echo "## chaintest（D-147 PR A 的試跑）"; echo; echo "- dryrun $k 次、$(( ($(date +%s) - t0) / 60 )) 分鐘；結束：$why"; } > "$O/summary.md" ;;
          esac
          cat "$O/summary.md" >> "$GITHUB_STEP_SUMMARY"
      # D-147 (A2): this step running (conclusion success, not skipped) is how the dispatcher tells a segment that gave
      # way (D-123) from one that stopped short: it neither chains it nor counts it as bad (six in a row: pause).
      - name: 讓位
        if: steps.t.outputs.yielded == 'true'
        run: echo "這一段讓位提早結束（D-123）"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: train-${{ needs.plan.outputs.mode }}${{ (needs.plan.outputs.mode == 'es' || needs.plan.outputs.mode == 'exam' || needs.plan.outputs.mode == 'examcheck' || needs.plan.outputs.mode == 'chaintest' || needs.plan.outputs.mode == 'auto' || needs.plan.outputs.nets != '[]') && format('-{0}', matrix.island) || '' }}
          path: out/
          # D-147 (ceo 2026-11-21): kept 90 days.
          retention-days: 90
          if-no-files-found: ignore

  # D-147 PR B: the only writer of the exam state. Adds up the training jobs' results (whatever they left: a job that
  # failed or gave way leaves what it played), lifts the pause AI_TRAIN_RESUME names, decides, and keeps the new state.
  # Not once the run is cancelled. The step 考試暫停 runs when the exam paused itself or is done: the dispatcher reads it
  # (in the API) and pauses the chain as P-<this run's id>, the same name as the exam's pause.
  merge:
    needs: [plan, train]
    if: "!cancelled() && needs.plan.outputs.mode == 'auto'"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Exam state
        id: s
        env:
          GH_TOKEN: ${{ github.token }}
          ARGS: ${{ needs.plan.outputs.args }}
        run: |
          C=$(echo " $ARGS " | sed -n 's/.* --config \([^ ]*\) .*/\1/p')
          "$GITHUB_WORKSPACE/.github/ai-train/exam-state.sh" "${C:-src/ai/learn/auto-config.json}" "$GITHUB_WORKSPACE/state"
      # None left (every job failed at the start): nothing to add, the games are played again next segment.
      - name: This segment's results
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: train-auto-*
          path: results
      - name: Merge
        id: m
        env:
          AI_TRAIN_RESUME: ${{ vars.AI_TRAIN_RESUME }}
          EXAM_CONFIG: ${{ steps.s.outputs.config }}
        run: |
          W="$GITHUB_WORKSPACE"
          node src/ai/learn/exam-auto.ts merge --state "$W/state/state.json" --config "$EXAM_CONFIG" --results "$W/results" --out "$W/new/state.json" \
            --pause-id "P-${{ github.run_id }}" --tree "$(git rev-parse HEAD:sim/src)" --commit "$GITHUB_SHA" --resume "$AI_TRAIN_RESUME" > /dev/null
          cat "$W/new/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.s.outputs.name }}
          path: new/
          retention-days: 90
      - name: 考試暫停
        if: steps.m.outputs.paused == 'true' || steps.m.outputs.done == 'true'
        run: echo "考試暫停了或考完了（原因在上面的 summary）；鏈會暫停，要使用者同意才再跑（AI_TRAIN_RESUME）"

  hours:
    needs: train
    if: always() && github.event_name != 'schedule' && inputs.mode != 'dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Runner hours of this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" \
            -q '[.jobs[] | select(.completed_at != null) | ((.completed_at | fromdate) - (.started_at | fromdate))] | add / 3600' \
            | awk '{ printf "## Runner 小時\n\n這次 run 已完成的 job 合計 %.2f 小時（不含這個 job）。\n", $1 }' | tee -a "$GITHUB_STEP_SUMMARY"
