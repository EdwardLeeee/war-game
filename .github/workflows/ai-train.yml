# D-086 B (war-game-ai, docs/research/2026-10-ai-nn.md): training the hard AI's small network on GitHub's
# machines, CPU only. Started by hand only: from the Actions tab (workflow_dispatch, once this file is on
# main), or by war-game-ai pushing a branch ai/train-* whose sim/src/ai/learn/run.json holds the same
# settings as the inputs below (ceo 2026-10-19), so training can start before this is merged.
# NN v2 (ai/train-v2, never merged; ceo 2026-10-29): a push starts a run only when it changes run.json; training
# and the evals each in their own concurrency group; at most 6 training jobs and 2 eval jobs at once (8 in all).
# NN v3 (ai/train-v3, never merged; ceo 2026-10-31): 3 islands, 120-minute games; a checkpoint's download is tried
# again (v2's chain broke on one failed download, run 41078447033); its own groups (ai-train-v3-*).
# NN v4 (ai/train-v4, never merged; D-122, ceo 2026-11-04): squads and the charge, from v3's weights (train.ts widens
# them); its own groups (ai-train-v4-*), so a trial runs beside v3's chain and the switch waits for a run's end.
# NN v4s (ai/train-v4s, never merged; ceo 2026-11-04, the user: idle runners all to the training): mode gen, one
# generation a run. The main chain (one job an island, its pairs as es plays them) never gives way; fill-in jobs play
# more pairs of the same generation on the runners nobody else uses: 20 (the account's limit) minus every other job
# running, the main chain's and 4 kept free for a new push, none while another workflow's jobs wait. A fill-in job
# looks every 4 minutes (2 API calls) and stops at once when another workflow has a run waiting or has started one
# since; half a pair is dropped. The step takes the mean over the pairs that came back, then the next generation.
# A job stops itself before its hours and leaves a checkpoint as an artifact (kept 14 days, never committed);
# the next run goes on from it (from_run). The last job adds up the runner hours of the run.
#   dryrun  cores and games an hour
#   record  hard's inputs and what it did, in AI-against-AI games (train-record), for looking into
#   es      evolution strategies, one island per job (train-es-<n>), from the network that plays exactly as hard
#           (from_run: an es run to go on from; chain: runs to start one after another, each from the one
#           before; cancel a run to stop it). Each chained run also starts an eval of its islands, unless pull
#           requests' checks are running then (they go first).
#   eval    islands_of: every island of from_run (or those in pick), each against hard and push-crush (train-eval-<n>);
#           with no control_run, hard itself on the same seeds too (train-eval-control); then a report of the
#           islands against that control (train-report)
name: AI train

on:
  workflow_dispatch:
    inputs:
      mode:
        description: dryrun, record, es, gen or eval
        type: choice
        options: [dryrun, record, es, gen, eval]
        default: dryrun
      from_run:
        description: The run whose artifacts this one starts from (es, eval)
        default: ""
      islands:
        description: "es: jobs, each its own search (at most 8); eval: the islands of from_run"
        default: "3"
      generations:
        description: "es: generations per job at most"
        default: "1000"
      hours:
        description: Hours a job plays before it saves and stops
        default: "4.5"
      games:
        description: "record: games; eval: games against hard on each map"
        default: "100"
      config:
        description: "es: settings over ES_DEFAULTS (JSON)"
        default: "{}"
      chain:
        description: "es: runs to start after this one, each from the one before (0: none)"
        default: "0"
      islands_of:
        description: "eval: the islands of from_run (false: hard itself only)"
        default: "false"
      pick:
        description: "eval: only these islands, comma-separated (empty: all)"
        default: ""
      control_run:
        description: "eval: the run with hard itself measured on the same seeds (train-eval-control; empty: measure it here)"
        default: ""
      args:
        description: "eval: more options for train.ts, e.g. --seed 2000001 --crush 20"
        default: "--seed 2000001 --crush 20"
      fill:
        description: "gen: fill-in jobs at most (auto: as many as the runners free allow)"
        default: "auto"
      retry:
        description: "gen: times this generation was started again after a failed step"
        default: "0"
  push:
    branches: ["ai/train-*"]
    paths: ["sim/src/ai/learn/run.json"]

permissions:
  contents: read
  actions: read

concurrency:
  group: ai-train-v4s-${{ inputs.mode || 'push' }}
  cancel-in-progress: false

jobs:
  # The settings: the inputs, or on a push the branch's sim/src/ai/learn/run.json (the same names).
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.p.outputs.mode }}
      from_run: ${{ steps.p.outputs.from_run }}
      islands: ${{ steps.p.outputs.islands }}
      generations: ${{ steps.p.outputs.generations }}
      hours: ${{ steps.p.outputs.hours }}
      games: ${{ steps.p.outputs.games }}
      config: ${{ steps.p.outputs.config }}
      args: ${{ steps.p.outputs.args }}
      count: ${{ steps.p.outputs.count }}
      chain: ${{ steps.p.outputs.chain }}
      control_run: ${{ steps.p.outputs.control_run }}
      play: ${{ steps.p.outputs.play }}
      fill: ${{ steps.p.outputs.fill }}
      fill_max: ${{ steps.p.outputs.fill_max }}
      start: ${{ steps.p.outputs.start }}
      retry: ${{ steps.p.outputs.retry }}
    steps:
      - if: github.event_name == 'push'
        uses: actions/checkout@v7
      - id: p
        env:
          EVENT: ${{ github.event_name }}
          INPUTS: ${{ toJSON(inputs) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT" = "push" ]; then
            f=sim/src/ai/learn/run.json
            [ -f "$f" ] || { echo "a push to ai/train-* needs $f" >&2; exit 1; }
            S=$(jq -c . "$f")
          else
            S="$INPUTS"
          fi
          get() { echo "$S" | jq -r --arg k "$1" --arg d "$2" '.[$k] // $d | if type == "string" then . else tojson end'; }
          mode=$(get mode dryrun)
          case "$mode" in dryrun|record|es|gen|eval) ;; *) echo "mode $mode" >&2; exit 1 ;; esac
          islands=$(get islands 6)
          n=$(( islands < 1 ? 1 : islands > 8 ? 8 : islands ))
          control_run=$(get control_run '')
          play='[]'
          fill=0
          fill_max=$(get fill auto)
          start=$(date +%s)
          if [ "$mode" = "es" ] || [ "$mode" = "gen" ]; then
            list=$(seq -s, 0 $((n - 1)) | sed 's/^/[/; s/$/]/')
          fi
          if [ "$mode" = "gen" ]; then
            # NN v4s: the runners nobody else uses. Every job running in this repository's other runs counts; another
            # workflow's job waiting (not AI train's or AI scratch's: theirs wait on their own max-parallel) means none.
            busy=0
            waiting=0
            # On an API error: no fill-in this time (the main chain goes on).
            ok=1
            : > runs.tsv
            for st in in_progress queued; do
              gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=$st&per_page=100" --jq '.workflow_runs[] | "\(.id)\t\(.name)"' >> runs.tsv || ok=0
            done
            sort -u -o runs.tsv runs.tsv
            while IFS=$'\t' read -r id name; do
              [ "$id" = "$GITHUB_RUN_ID" ] && continue
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" --paginate --jq '.jobs[].status' > jobs.txt || ok=0
              r=$(grep -cx in_progress jobs.txt || true)
              q=$(grep -cxE 'queued|waiting|pending|requested' jobs.txt || true)
              busy=$((busy + r))
              case "$name" in
                "AI train"|"AI scratch") ;;
                *) waiting=$((waiting + q)) ;;
              esac
            done < runs.tsv
            fill=$((20 - busy - n - 4))
            if [ "$waiting" -gt 0 ] || [ "$ok" = 0 ] || [ "$fill" -lt 0 ]; then fill=0; fi
            if [ "$fill_max" != "auto" ] && [ "$fill" -gt "$fill_max" ]; then fill=$fill_max; fi
            # The main chain's jobs, then the fill-in jobs: slot k plays for island k % n, its slot k / n of that island's.
            play=$(jq -nc --argjson n "$n" --argjson f "$fill" '[range(0; $n) | {kind: "base", island: ., slot: -1, slots: 0}] + [range(0; $f) | {kind: "fill", island: (. % $n), slot: ((. / $n) | floor), slots: ((($f - 1 - (. % $n)) / $n | floor) + 1)}]')
            echo "其他 run 正在跑的 job：${busy}，其他 workflow 在等的 job：${waiting}$([ "$ok" = 0 ] && echo "（API 出錯，不開補位）")；主鏈 ${n}、保留 4，補位 ${fill}（上限 ${fill_max}）。" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$mode" = "es" ] || [ "$mode" = "gen" ]; then
            :
          elif [ "$mode" = "eval" ]; then
            # The islands (all, or those picked), then hard itself unless control_run has it.
            pick=$(get pick '')
            if [ "$(get islands_of false)" = "true" ]; then
              if [ -n "$pick" ]; then list=$(echo "$pick" | jq -Rc 'split(",") | map(select(. != ""))'); else list=$(seq 0 $((n - 1)) | jq -Rsc 'split("\n") | map(select(. != "")) | map(., . + "b")'); fi
            else list='[]'; fi
            if [ -z "$control_run" ]; then list=$(echo "$list" | jq -c '. + ["control"]'); fi
          else
            list='[0]'
          fi
          {
            echo "mode=$mode"
            echo "from_run=$(get from_run '')"
            echo "islands=$list"
            echo "generations=$(get generations 1000)"
            echo "hours=$(get hours 4.5)"
            echo "games=$(get games 100)"
            echo "config=$(get config '{}')"
            echo "args=$(get args '')"
            echo "count=$n"
            echo "chain=$(get chain 0)"
            echo "control_run=$control_run"
            echo "play=$play"
            echo "fill=$fill"
            echo "fill_max=$fill_max"
            echo "start=$start"
            echo "retry=$(get retry 0)"
          } >> "$GITHUB_OUTPUT"
          echo "設定：$(echo "$S" | jq -c .)" >> "$GITHUB_STEP_SUMMARY"

  train:
    needs: plan
    if: needs.plan.outputs.mode != 'gen'
    name: ${{ needs.plan.outputs.mode }} (${{ matrix.island }})
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      # ceo 2026-10-29: training and evals 8 jobs at most, 6 and 2.
      max-parallel: ${{ needs.plan.outputs.mode == 'eval' && 2 || 6 }}
      matrix:
        island: ${{ fromJSON(needs.plan.outputs.islands) }}
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # NN v3 (ceo 2026-10-31): this island's checkpoint only, tried up to 6 times over about 10 minutes (GitHub's
      # "Unable to download artifact(s)" broke v2's chain at run 41078447033).
      - name: The start (from_run), tried again on failure
        if: needs.plan.outputs.from_run != '' && matrix.island != 'control'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          FROM_RUN: ${{ needs.plan.outputs.from_run }}
          ISLAND: ${{ matrix.island }}
        run: |
          for k in 1 2 3 4 5 6; do
            rm -rf "from/train-es-${ISLAND%b}"
            # NN v3 B: island "<n>b" is island n's best candidate.
            I="${ISLAND%b}"
            if gh run download "$FROM_RUN" --repo "$GITHUB_REPOSITORY" --name "train-es-$I" --dir "from/train-es-$I"; then exit 0; fi
            echo "download $k of run $FROM_RUN island $ISLAND failed; again in $((k * 30)) s"
            sleep $((k * 30))
          done
          exit 1
      - name: Train
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          ISLAND: ${{ matrix.island }}
          HOURS: ${{ needs.plan.outputs.hours }}
          GENERATIONS: ${{ needs.plan.outputs.generations }}
          GAMES: ${{ needs.plan.outputs.games }}
          CONFIG: ${{ needs.plan.outputs.config }}
          ARGS: ${{ needs.plan.outputs.args }}
          FROM_RUN: ${{ needs.plan.outputs.from_run }}
        run: |
          set -o pipefail
          F="${GITHUB_WORKSPACE}/from"
          O="${GITHUB_WORKSPACE}/out"
          T="src/ai/learn/train.ts"
          # "args": more options for train.ts (eval: --seed, --crush), split on spaces.
          set -- $ARGS
          case "$MODE" in
            dryrun) node $T dryrun --out "$O" ;;
            record) node $T record --games "$GAMES" --out "$O" ;;
            es)
              R="$F/train-es-$ISLAND"
              # One artifact may be unpacked straight into from/.
              if [ ! -f "$R/state.json" ] && [ "$ISLAND" = "0" ] && [ -f "$F/state.json" ]; then R="$F"; fi
              if [ -f "$R/state.json" ]; then
                node $T es --start "$R/net.json" --resume "$R" --config "$CONFIG" --island "$ISLAND" --out "$O" --hours "$HOURS" --generations "$GENERATIONS"
              elif [ -n "$FROM_RUN" ]; then
                echo "run $FROM_RUN has no state.json for island $ISLAND: not starting it again from hard" >&2; exit 1
              else
                node $T es --seed $((ISLAND + 1)) --config "$CONFIG" --island "$ISLAND" --out "$O" --hours "$HOURS" --generations "$GENERATIONS"
              fi ;;
            eval)
              if [ "$ISLAND" = "control" ]; then
                node $T eval --name control --games "$GAMES" --out "$O" "$@"
              else
                # NN v3 B: "<n>b": island n's best candidate of its last generation, on the same new seeds.
                N="$F/train-es-$ISLAND/net.json"
                NAME="島 $ISLAND"
                case "$ISLAND" in *b) N="$F/train-es-${ISLAND%b}/best.json"; NAME="島 ${ISLAND%b} 最好的候選" ;; esac
                if [ ! -f "$N" ] && [ "$ISLAND" = "0" ] && [ -f "$F/net.json" ]; then N="$F/net.json"; fi
                [ -f "$N" ] || { echo "run $FROM_RUN has no net.json for island $ISLAND" >&2; exit 1; }
                node $T eval --net "$N" --name "$NAME" --games "$GAMES" --out "$O" "$@"
              fi ;;
          esac
          cat "$O/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: train-${{ needs.plan.outputs.mode }}-${{ matrix.island }}
          path: out/
          retention-days: 14
          if-no-files-found: ignore

  # eval: the islands against hard itself on the same seeds (this run's control, or control_run's).
  report:
    needs: [plan, train]
    if: always() && needs.plan.outputs.mode == 'eval'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/download-artifact@v7
        with:
          pattern: train-eval-*
          path: evals
      - name: The control (control_run), tried again on failure
        if: needs.plan.outputs.control_run != ''
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_RUN: ${{ needs.plan.outputs.control_run }}
        run: |
          for k in 1 2 3 4 5 6; do
            rm -rf control
            if gh run download "$CONTROL_RUN" --repo "$GITHUB_REPOSITORY" --name train-eval-control --dir control; then exit 0; fi
            echo "download $k of the control failed; again in $((k * 30)) s"
            sleep $((k * 30))
          done
          exit 1
      - name: Report
        run: |
          C="${GITHUB_WORKSPACE}/control/eval.json"
          node src/ai/learn/train.ts report --dir "${GITHUB_WORKSPACE}/evals" --control "$C" --out "${GITHUB_WORKSPACE}/report"
          cat "${GITHUB_WORKSPACE}/report/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: train-report
          path: report/
          retention-days: 14
          if-no-files-found: ignore

  hours:
    needs: [plan, train]
    if: always() && needs.plan.outputs.mode != 'gen'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Runner hours of this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" \
            -q '[.jobs[] | select(.completed_at != null) | ((.completed_at | fromdate) - (.started_at | fromdate))] | add / 3600' \
            | awk '{ printf "## Runner 小時\n\n這次 run 已完成的 job 合計 %.2f 小時（不含這個 job）。\n", $1 }' | tee -a "$GITHUB_STEP_SUMMARY"

  # A started es run (not a push's trial): with chain, the next run, from this one's checkpoints, once every job
  # here has saved one (it waits in its group until this run is over); and an eval of this run's islands, the
  # last run's too. workflow_dispatch is the one event GITHUB_TOKEN may start.
  next:
    needs: [plan, train]
    if: needs.plan.outputs.mode == 'es' && github.event_name == 'workflow_dispatch' && needs.train.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Start the next run and the eval
        env:
          GH_TOKEN: ${{ github.token }}
          COUNT: ${{ needs.plan.outputs.count }}
          GENERATIONS: ${{ needs.plan.outputs.generations }}
          HOURS: ${{ needs.plan.outputs.hours }}
          CHAIN: ${{ needs.plan.outputs.chain }}
          CONTROL_RUN: ${{ needs.plan.outputs.control_run }}
        run: |
          if [ "$CHAIN" != "0" ]; then
            left=$((CHAIN - 1))
            gh workflow run ai-train.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
              -f mode=es -f from_run="$GITHUB_RUN_ID" -f islands="$COUNT" -f generations="$GENERATIONS" -f hours="$HOURS" -f chain="$left" -f control_run="$CONTROL_RUN"
            echo "下一個 run 從這次（${GITHUB_RUN_ID}）接著練，之後還會再接 ${left} 次。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "接續次數用完，不再接下一個 run。" >> "$GITHUB_STEP_SUMMARY"
          fi
          # Pull requests' checks first (ceo 2026-10-29): with any running or waiting, no eval this time.
          busy=0
          for s in in_progress queued; do
            busy=$((busy + $(gh run list --repo "$GITHUB_REPOSITORY" --event pull_request --status "$s" --limit 50 --json databaseId -q length)))
          done
          if [ "$busy" -gt 0 ]; then
            echo "有 ${busy} 個 PR 的檢查在跑或在等，這次不比強弱。" >> "$GITHUB_STEP_SUMMARY"
          else
            gh workflow run ai-train.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
              -f mode=eval -f from_run="$GITHUB_RUN_ID" -f islands="$COUNT" -f islands_of=true -f control_run="$CONTROL_RUN" -f games=100 -f args="--seed 2000001 --crush 20"
            echo "比強弱：這次的 ${COUNT} 個島對困難各 200 局、push-crush 40 局（對照 run ${CONTROL_RUN:-在比強弱的 run 裡量}）。" >> "$GITHUB_STEP_SUMMARY"
          fi

  # NN v4s (ceo 2026-11-04): one generation. The main chain's job of each island (its pairs, never gives way) and the
  # fill-in jobs (more pairs while the main chain plays; each stops at once when another workflow waits or starts).
  play:
    needs: plan
    if: needs.plan.outputs.mode == 'gen'
    name: play (${{ matrix.p.kind }} ${{ matrix.p.island }}${{ matrix.p.kind == 'fill' && format('-{0}', matrix.p.slot) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        p: ${{ fromJSON(needs.plan.outputs.play) }}
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: The start (from_run), tried again on failure
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          FROM_RUN: ${{ needs.plan.outputs.from_run }}
          I: ${{ matrix.p.island }}
        run: |
          for k in 1 2 3 4 5 6; do
            rm -rf "from/train-es-$I"
            if gh run download "$FROM_RUN" --repo "$GITHUB_REPOSITORY" --name "train-es-$I" --dir "from/train-es-$I"; then exit 0; fi
            echo "download $k of run $FROM_RUN island $I failed; again in $((k * 30)) s"
            sleep $((k * 30))
          done
          exit 1
      - name: Play
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ matrix.p.kind }}
          I: ${{ matrix.p.island }}
          SLOT: ${{ matrix.p.slot }}
          SLOTS: ${{ matrix.p.slots }}
          CONFIG: ${{ needs.plan.outputs.config }}
          START: ${{ needs.plan.outputs.start }}
        run: |
          O="${GITHUB_WORKSPACE}/out"
          R="${GITHUB_WORKSPACE}/from/train-es-$I"
          T="src/ai/learn/train.ts"
          mkdir -p "$O"
          if [ "$KIND" = "base" ]; then
            node $T pairs --resume "$R" --island "$I" --config "$CONFIG" --out "$O"
          else
            # Every 4 minutes, 2 calls: another workflow's run waiting, or one started since this job did: give way.
            # (A run started before shows its jobs at once, Sim's ~140 too: the plan saw them waiting and started no
            # fill-in; a summary job queued later fits the 4 kept free.) Two failed looks in a row: give way too.
            SINCE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            (
              err=0
              while sleep 240; do
                if q=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=queued&per_page=100" --jq '[.workflow_runs[] | select(.name != "AI train" and .name != "AI scratch")] | length') \
                  && s=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=in_progress&per_page=100" | jq --arg t "$SINCE" '[.workflow_runs[] | select(.name != "AI train" and .name != "AI scratch" and .created_at > $t)] | length'); then
                  err=0
                else
                  err=$((err + 1))
                  q=0
                  s=0
                fi
                if [ "$err" -ge 2 ] || [ "$q" -gt 0 ] || [ "$s" -gt 0 ]; then
                  echo "$(date -u +%H:%M:%S) 其他 workflow 等著的 run ${q}、新開的 run ${s}$([ "$err" -ge 2 ] && echo "、API 連續出錯")" > "$O/stop"
                  break
                fi
              done
            ) &
            W=$!
            node $T pairs --resume "$R" --island "$I" --config "$CONFIG" --out "$O" --slot "$SLOT" --slots "$SLOTS" --start-at "$START"
            kill "$W" 2>/dev/null || true
          fi
          cat "$O/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pairs-${{ matrix.p.island }}-${{ matrix.p.kind }}${{ matrix.p.kind == 'fill' && format('-{0}', matrix.p.slot) || '' }}
          path: out/pairs.json
          retention-days: 3
          if-no-files-found: ignore

  # NN v4s: each island's step from the pairs that came back (the main chain's must all be there).
  step:
    needs: [plan, play]
    if: always() && needs.plan.outputs.mode == 'gen'
    name: step (${{ matrix.island }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        island: ${{ fromJSON(needs.plan.outputs.islands) }}
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: The start (from_run), tried again on failure
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          FROM_RUN: ${{ needs.plan.outputs.from_run }}
          I: ${{ matrix.island }}
        run: |
          for k in 1 2 3 4 5 6; do
            rm -rf "from/train-es-$I"
            if gh run download "$FROM_RUN" --repo "$GITHUB_REPOSITORY" --name "train-es-$I" --dir "from/train-es-$I"; then exit 0; fi
            echo "download $k of run $FROM_RUN island $I failed; again in $((k * 30)) s"
            sleep $((k * 30))
          done
          exit 1
      - uses: actions/download-artifact@v7
        with:
          pattern: pairs-${{ matrix.island }}-*
          path: pairs
      - name: Step
        env:
          GH_TOKEN: ${{ github.token }}
          I: ${{ matrix.island }}
          CONFIG: ${{ needs.plan.outputs.config }}
        run: |
          # How long the main chain waited for a runner: the plan's start to this island's main job's start.
          WAIT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --paginate 2>/dev/null \
            | jq -s --arg b "play (base $I)" '[.[].jobs[]] | ((map(select(.name == "plan"))[0].started_at | fromdate) as $p | (map(select(.name == $b))[0].started_at | fromdate) - $p)' 2>/dev/null || echo -1)
          node src/ai/learn/train.ts step --resume "${GITHUB_WORKSPACE}/from/train-es-$I" --pairs "${GITHUB_WORKSPACE}/pairs" --island "$I" --config "$CONFIG" --wait "${WAIT:--1}" --out "${GITHUB_WORKSPACE}/out"
          cat "${GITHUB_WORKSPACE}/out/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: train-es-${{ matrix.island }}
          path: out/
          retention-days: 14
          if-no-files-found: ignore

  # NN v4s: the next generation (chain), from this one, or this one again from the same start when a step failed (at
  # most twice); an eval every 4 generations unless pull requests' checks run or wait; this run's runner hours.
  gnext:
    needs: [plan, play, step]
    if: always() && needs.plan.outputs.mode == 'gen' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Start the next generation and the eval
        env:
          GH_TOKEN: ${{ github.token }}
          STEP: ${{ needs.step.result }}
          FROM_RUN: ${{ needs.plan.outputs.from_run }}
          COUNT: ${{ needs.plan.outputs.count }}
          CHAIN: ${{ needs.plan.outputs.chain }}
          FILL: ${{ needs.plan.outputs.fill_max }}
          CONFIG: ${{ needs.plan.outputs.config }}
          RETRY: ${{ needs.plan.outputs.retry }}
          CONTROL_RUN: ${{ needs.plan.outputs.control_run }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --paginate \
            | jq -rs '[.[].jobs[] | select(.completed_at != null and .started_at != null) | {k: (if (.name | startswith("play (fill")) then "補位" elif (.name | startswith("play (base")) then "主鏈" else "其他" end), h: (((.completed_at | fromdate) - (.started_at | fromdate)) / 3600)}] | group_by(.k) | map("\(.[0].k) \(map(.h) | add | . * 100 | round / 100) 小時（\(length) 個 job）") | join("，")' \
            | sed 's/^/## Runner 小時\n\n這次 run 已完成的 job：/' >> "$GITHUB_STEP_SUMMARY" || true
          if [ "$STEP" = "success" ]; then
            FROM="$GITHUB_RUN_ID"; LEFT=$((CHAIN - 1)); AGAIN=0
          elif [ "$RETRY" -lt 2 ]; then
            FROM="$FROM_RUN"; LEFT="$CHAIN"; AGAIN=$((RETRY + 1))
            echo "這代有島沒算完（step：${STEP}），從 run ${FROM_RUN} 再算一次（第 ${AGAIN} 次）。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "這代連續 3 次沒算完，鏈停在這裡（從 run ${FROM_RUN}）。" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$CHAIN" != "0" ]; then
            gh workflow run ai-train.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
              -f mode=gen -f from_run="$FROM" -f islands="$COUNT" -f chain="$LEFT" -f fill="$FILL" -f config="$CONFIG" -f retry="$AGAIN" -f control_run="$CONTROL_RUN"
            echo "下一代從 run ${FROM} 接著練，之後還會再接 ${LEFT} 代。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "接續次數用完，不再接下一代。" >> "$GITHUB_STEP_SUMMARY"
          fi
          # Every 4 generations (and the last), an eval of this one's islands; pull requests' checks first.
          if [ "$STEP" = "success" ] && [ $((LEFT % 4)) -eq 0 ]; then
            busy=0
            for s in in_progress queued; do
              busy=$((busy + $(gh run list --repo "$GITHUB_REPOSITORY" --event pull_request --status "$s" --limit 50 --json databaseId -q length)))
            done
            if [ "$busy" -gt 0 ]; then
              echo "有 ${busy} 個 PR 的檢查在跑或在等，這次不比強弱。" >> "$GITHUB_STEP_SUMMARY"
            else
              gh workflow run ai-train.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
                -f mode=eval -f from_run="$GITHUB_RUN_ID" -f islands="$COUNT" -f islands_of=true -f control_run="$CONTROL_RUN" -f games=100 -f args="--seed 2000001 --crush 20"
              echo "比強弱：這代的 ${COUNT} 個島對困難各 200 局、push-crush 40 局（對照 run ${CONTROL_RUN:-在比強弱的 run 裡量}）。" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
