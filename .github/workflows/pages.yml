name: Pages

# Publishes the GitHub Pages site (Actions source; docs/ is never published).
# Every deployment replaces the whole site, so this one workflow builds all of it:
#   (the site's home) the game (client/), with the hashes its determinism check compares against
#                     (headless run of the same game, sim/); at proto/ until the user 2026-11-24:
#                     「網址可以拿掉proto了」
#   proto/            the old address (client/site/proto/): goes to the home with what it carried,
#                     takes away that address's service worker, and a manifest for its 主畫面 icons
#   spikes/web/, spikes/godot/   the two engine spike pages, kept as the record of the engine choice:
#                     rebuilt from the last commit that changed spikes/, so they show that
#                     commit, and cached by it so most runs skip the Godot install (at web/,
#                     godot/ until 2026-11-24); spikes/index.html takes their 回首頁 (../) home
#   licenses.html, licenses/   licence texts (client/site/)
# Pull requests build only. Pushes to main deploy (the github-pages environment accepts only
# main), and only when all three parts were built. Replaces spike-pages.yml.
# Markdown under client/ and sim/ (README, PROTOCOL, notices) is in neither the site nor its
# build: changing only that must not redeploy, as a new deployment changes the version the
# players see and tells them 有新版本 (ceo 2026-10-03). A pull request is judged by all the
# files it changes, a push by the files it brings. Of services/game-logs/ only the record
# schema is in the page (D-056); the Worker itself is deployed by the user, not here.
on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "!client/docs/**"
      - "!client/**/*.md"
      - "sim/**"
      - "!sim/**/*.md"
      - "spikes/**"
      - "services/game-logs/src/record.ts"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "client/**"
      - "!client/docs/**"
      - "!client/**/*.md"
      - "sim/**"
      - "!sim/**/*.md"
      - "spikes/**"
      - "services/game-logs/src/record.ts"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# Deployments queue one at a time; a pull request's builds only replace each other.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      complete: ${{ steps.complete.outputs.complete }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            spikes/web/package-lock.json

      - name: Which commit the spike pages come from
        id: spike
        run: |
          sha="$(git log -1 --format=%H -- spikes/)"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "spike pages from $(git log -1 --format='%h %s' "${sha}")"
      - name: Spike pages from cache
        id: spike-cache
        uses: actions/cache@v6
        with:
          path: spike-site
          key: pages-spike-site-${{ steps.spike.outputs.sha }}-v1
      - name: Check out the spike commit
        if: steps.spike-cache.outputs.cache-hit != 'true'
        run: git worktree add --detach "${RUNNER_TEMP}/spike-src" "${{ steps.spike.outputs.sha }}"
      # Same steps as spike-pages.yml. Without GITHUB_SHA the page's commit label comes from
      # `git rev-parse HEAD` in the spike checkout, i.e. the spike commit.
      - name: PixiJS spike page and the hashes it compares against
        if: steps.spike-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}/spike-src/spikes/web
        run: |
          set -euo pipefail
          npm ci
          node src/headless.ts --mode scripted --out "${RUNNER_TEMP}/web-hashes"
          node src/headless.ts --mode ai --out "${RUNNER_TEMP}/web-hashes"
          env -u GITHUB_SHA npm run build
          node ../tools/expected-hashes.mjs "${RUNNER_TEMP}/web-hashes" scripted ai > dist/expected-hashes.json
          mkdir -p "${GITHUB_WORKSPACE}/spike-site/licenses"
          cp -R dist "${GITHUB_WORKSPACE}/spike-site/web"
          cp node_modules/pixi.js/LICENSE "${GITHUB_WORKSPACE}/spike-site/licenses/pixi.js-LICENSE.txt"
      - if: steps.spike-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}-linux-v1
      - if: steps.spike-cache.outputs.cache-hit != 'true'
        run: '"${RUNNER_TEMP}/spike-src/spikes/godot/ci/install-godot.sh" web_nothreads_release.zip web_nothreads_debug.zip android_debug.apk android_release.apk'
      - name: Godot spike page (single-threaded web export)
        if: steps.spike-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}/spike-src/spikes/godot
        run: |
          set -euo pipefail
          ${GODOT} --headless --import
          bash ci/pages.sh "${GITHUB_WORKSPACE}/spike-site/godot"
          base="https://raw.githubusercontent.com/godotengine/godot/${GODOT_VERSION}-stable"
          curl -sSLf -o "${GITHUB_WORKSPACE}/spike-site/licenses/godot-LICENSE.txt" "${base}/LICENSE.txt"
          curl -sSLf -o "${GITHUB_WORKSPACE}/spike-site/licenses/godot-COPYRIGHT.txt" "${base}/COPYRIGHT.txt"

      # The units' atlases (D-085): the Release art.lock.json pins, checked against its SHA-256; and
      # art-lab.lock.json's for art-v7 量測 (D-128), beside them until the game switches to it.
      - name: Atlases from cache
        uses: actions/cache@v6
        with:
          path: client/.art-cache
          key: art-${{ hashFiles('client/art.lock.json', 'client/art-lab.lock.json') }}
      - name: The game
        working-directory: client
        run: |
          set -euo pipefail
          npm ci
          node scripts/fetch-art.ts --lab
          # 寫實地面's development set (R7's CC0 photos, by ui's sha256; ?test=1&ground=real only) until
          # art-v6 ships ui's ground: a failed download is a warning, never a failed build.
          node scripts/fetch-ground-dev.ts
          npm run build
          bash scripts/expected-hashes.sh dist/expected-hashes.json
          mkdir -p ../site
          cp -R dist/. ../site/

      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p site/spikes
          cp -R spike-site/web spike-site/godot site/spikes/
          cp -R spike-site/licenses site/
          cp client/site/licenses.html site/
          cp -R client/site/proto client/site/spikes site/
          find site -maxdepth 2 | sort
          du -sh site site/*
      - name: Are all parts there?
        id: complete
        run: |
          complete=true
          for f in index.html expected-hashes.json version.json manifest.webmanifest sw.js \
                   proto/index.html proto/sw.js proto/manifest.webmanifest \
                   spikes/index.html spikes/web/index.html spikes/web/expected-hashes.json spikes/godot/index.html licenses.html \
                   licenses/pixi.js-LICENSE.txt licenses/godot-LICENSE.txt licenses/godot-COPYRIGHT.txt; do
            [ -s "site/${f}" ] || { echo "::warning::missing site/${f}: building only, not deploying"; complete=false; }
          done
          echo "complete=${complete}" >> "${GITHUB_OUTPUT}"
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && needs.build.outputs.complete == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          # 30 minutes, not the default 10: the site is about 317 MB and GitHub Pages has stayed in syncing_files past
          # 10 minutes (3c26ebf, a7793ec, 507a9a6 on 2026-11-10, each cancelled; a rerun then went through).
          timeout: 1800000

  # The published site, the way the user opens it: every page loads, the home is this commit's game, proto/ goes to it.
  live:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Playwright's own image, as client.yml's e2e: WebKit and the system libraries it needs are already in it, so
    # nothing comes from the Ubuntu package mirror (run 45329961489: `playwright install --with-deps webkit` at
    # 116 kB/s from the mirror, the job cancelled at its 20 minutes; the site itself was deployed).
    # The tag is the Playwright version package-lock.json locks (a step below checks it).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - name: The image has the Playwright that package-lock.json locks
        run: |
          locked=$(node -p 'require("./package-lock.json").packages["node_modules/@playwright/test"].version')
          if [ "$locked" != "1.63.0" ]; then
            echo "::error::package-lock.json locks Playwright $locked; change the container image in pages.yml to v$locked-noble"
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: node scripts/live-check.ts "${{ needs.deploy.outputs.page_url }}" "${GITHUB_SHA::7}" "${GITHUB_WORKSPACE}/live"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pages-live
          path: live/
          retention-days: 30
          if-no-files-found: ignore
