name: Client

# Phase 2 prototype client (docs/briefs/2026-10-client-prototype.md): type check and unit
# tests, then the Playwright flows in WebKit and Chromium at iPhone 14 Pro Max landscape
# size with touch, including the determinism check against a headless run of the same game. Also runs when sim/ changes, so an interface change that breaks the
# client shows up on that pull request. Not a required check: the path filter would leave
# unrelated pull requests waiting.
on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "!client/docs/**"
      - "sim/**"
      - ".github/workflows/client.yml"
  pull_request:
    paths:
      - "client/**"
      - "!client/docs/**"
      - "sim/**"
      - ".github/workflows/client.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    # Install (at most 20 minutes, below) plus the tests (about 5).
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, chromium]
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Hashes the page's determinism check compares against (headless run of the same game)
        run: bash scripts/expected-hashes.sh dist/expected-hashes.json
      # WebKit's system libraries (about 130 MB from the Ubuntu mirror) took 12–18 minutes to
      # download on some runners (#44, 2026-10-01; normally under a minute). Each try gets
      # 5 minutes, up to 3 tries. Stopping a try leaves its apt-get running under sudo, holding
      # the dpkg lock (run 36761738752), so it is stopped and waited for before the next try.
      # apt keeps what it already downloaded, so the next try carries on from there, and
      # dpkg --configure -a finishes an interrupted unpack.
      - name: Install ${{ matrix.browser }}
        timeout-minutes: 20
        run: |
          for attempt in 1 2 3; do
            if timeout --kill-after=20s 300 npx playwright install --with-deps ${{ matrix.browser }}; then exit 0; fi
            echo "::warning::installing ${{ matrix.browser }}: try $attempt failed or took over 5 minutes"
            sudo pkill -x apt-get || true
            for i in $(seq 60); do pgrep -x apt-get > /dev/null || pgrep -x dpkg > /dev/null || break; sleep 1; done
            sudo dpkg --configure -a || true
          done
          exit 1
      - run: npx playwright test --project=${{ matrix.browser }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-e2e-${{ matrix.browser }}
          path: |
            client/playwright-report/
            client/test-results/
          retention-days: 30
          if-no-files-found: ignore
