name: Client

# Phase 2 prototype client (docs/briefs/2026-10-client-prototype.md): type check and unit
# tests, then the Playwright flows in WebKit and Chromium at iPhone 14 Pro Max landscape
# size with touch, including the determinism check against a headless run of the same game. Also runs when sim/ changes, so an interface change that breaks the
# client shows up on that pull request. Not a required check: the path filter would leave
# unrelated pull requests waiting.
# Markdown under client/ and sim/ is not read by the build or the tests, so changing only that
# runs nothing (ceo 2026-10-03). services/game-logs/ (the Worker that collects game records,
# D-056) is type-checked and unit-tested with the client: the page builds its records with
# the Worker's schema.
on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "!client/docs/**"
      - "!client/**/*.md"
      - "sim/**"
      - "!sim/**/*.md"
      - "services/game-logs/**"
      - "!services/game-logs/**/*.md"
      - ".github/workflows/client.yml"
  pull_request:
    paths:
      - "client/**"
      - "!client/docs/**"
      - "!client/**/*.md"
      - "sim/**"
      - "!sim/**/*.md"
      - "services/game-logs/**"
      - "!services/game-logs/**/*.md"
      - ".github/workflows/client.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: e2e (${{ matrix.browser }}${{ matrix.part }})
    runs-on: ubuntu-latest
    # Pulling the image, the build and the tests. A runner can be twice as slow as another with the
    # same tests (the same 148: run 42319995429 17.5 minutes, run 42351293370 over 30, cancelled), so
    # a shard has to fit in this at twice its usual time: Chromium in four, WebKit in two. Whole test
    # files stay together, so the shards are not even (about 11, 8, 6 and 9 minutes on a quick runner).
    timeout-minutes: 30
    # Playwright's own image: the browsers and the system libraries they need are already in
    # it, so nothing comes from the Ubuntu package mirror. Installing them on the runner took
    # 12–25+ minutes on some runners (#44, #63's run 36881450879, #65's run 36887698710).
    # The tag is the Playwright version package-lock.json locks (a step below checks it).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: webkit
            shard: 1/2
            part: " 1/2"
            artifact: webkit-1
          - browser: webkit
            shard: 2/2
            part: " 2/2"
            artifact: webkit-2
          - browser: chromium
            shard: 1/4
            part: " 1/4"
            artifact: chromium-1
          - browser: chromium
            shard: 2/4
            part: " 2/4"
            artifact: chromium-2
          - browser: chromium
            shard: 3/4
            part: " 3/4"
            artifact: chromium-3
          - browser: chromium
            shard: 4/4
            part: " 4/4"
            artifact: chromium-4
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      # A slow job's log then says which machine it had (the same tests take from 14 to 30 minutes).
      - name: The runner
        run: |
          grep -m1 'model name' /proc/cpuinfo
          nproc
      - name: The image has the Playwright that package-lock.json locks
        run: |
          locked=$(node -p 'require("./package-lock.json").packages["node_modules/@playwright/test"].version')
          if [ "$locked" != "1.63.0" ]; then
            echo "::error::package-lock.json locks Playwright $locked; change the container image in client.yml to v$locked-noble"
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      # The units' atlases (D-085, docs/sprite-atlas.md section 2): the Release art.lock.json pins
      # (checked against its SHA-256; none pinned: nothing), art-lab.lock.json's as the Pages site has
      # it (art-v7 量測 and the ASTC 樣本, D-128; the same cache as Pages'), and the stand-ins the tests draw.
      - uses: actions/cache@v6
        with:
          path: client/.art-cache
          key: art-${{ hashFiles('client/art.lock.json', 'client/art-lab.lock.json') }}
      - name: Atlases
        run: |
          node scripts/fetch-art.ts --lab
          node scripts/make-test-atlas.ts
      - run: npm run build
      - name: Hashes the page's determinism check compares against (headless run of the same game)
        run: bash scripts/expected-hashes.sh dist/expected-hashes.json
      - run: npx playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}
      # The report and each failed test's screenshot and trace, an attempt each: a rerun keeps the
      # one before (#408's run 42146287448: attempt 3 replaced attempt 2's, whose failure was gone).
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-e2e-${{ matrix.artifact }}-attempt-${{ github.run_attempt }}
          path: |
            client/playwright-report/
            client/test-results/
          retention-days: 7
          if-no-files-found: ignore
