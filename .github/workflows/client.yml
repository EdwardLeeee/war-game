name: Client

# Phase 2 prototype client (docs/briefs/2026-10-client-prototype.md): type check and unit
# tests, then the Playwright flows in WebKit and Chromium at iPhone 14 Pro Max landscape
# size with touch, including the determinism check against a headless run of the same game. Also runs when sim/ changes, so an interface change that breaks the
# client shows up on that pull request. Not a required check: the path filter would leave
# unrelated pull requests waiting.
on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "!client/docs/**"
      - "sim/**"
      - ".github/workflows/client.yml"
  pull_request:
    paths:
      - "client/**"
      - "!client/docs/**"
      - "sim/**"
      - ".github/workflows/client.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    # Install (at most 25 minutes, below) plus the tests (about 5).
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, chromium]
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Hashes the page's determinism check compares against (headless run of the same game)
        run: bash scripts/expected-hashes.sh dist/expected-hashes.json
      # Same as sim.yml (core, 3ba971f): apt gives up on a download that stalls for 30 s and
      # tries it again, up to 5 times, inside one try below.
      - name: Let apt retry stalled downloads
        run: printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80-retries
      # WebKit's system libraries (about 130 MB from the Ubuntu mirror) took 12–18 minutes to
      # download on some runners (#44, 2026-10-01; normally under a minute). Same as sim.yml:
      # one try, and apt itself retries a stalled download (above). Stopping a try from outside
      # (`timeout`, then trying again) left dpkg locked or half done, and on a slow mirror four
      # tries of 5 minutes never finished (#63's Client run 36881450879), while sim.yml's way
      # went through. The step limit allows the slowest download seen.
      - name: Install ${{ matrix.browser }}
        timeout-minutes: 25
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.browser }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-e2e-${{ matrix.browser }}
          path: |
            client/playwright-report/
            client/test-results/
          retention-days: 30
          if-no-files-found: ignore
