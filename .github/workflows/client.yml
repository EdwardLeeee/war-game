name: Client

# Phase 2 prototype client (docs/briefs/2026-10-client-prototype.md): type check and unit
# tests, then the Playwright flows in WebKit and Chromium at iPhone 14 Pro Max landscape
# size with touch. Also runs when sim/ changes, so an interface change that breaks the
# client shows up on that pull request. Not a required check: the path filter would leave
# unrelated pull requests waiting.
on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "sim/**"
      - ".github/workflows/client.yml"
  pull_request:
    paths:
      - "client/**"
      - "sim/**"
      - ".github/workflows/client.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, chromium]
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.browser }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-e2e-${{ matrix.browser }}
          path: |
            client/playwright-report/
            client/test-results/
          retention-days: 30
          if-no-files-found: ignore
