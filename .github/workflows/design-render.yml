# Final design renders (Blender, Cycles CPU) for the ui rounds.
# The developer laptop keeps a 2 GB memory reserve for everyone else, so big or
# supersampled renders run here instead. Not a required check.
name: design-render

on:
  workflow_dispatch:
    inputs:
      round:
        description: "round2, round3, round4, round5 or production"
        default: "round5"
      targets:
        description: 'JSON list: round2 ["0","A","B","C"]; round3 ["mage0","mageA","mageB","mageC","legs"]; round4 ["mageTA","mageTB","mageTC","farmer"]; round5 ["mageWA","mageWB","mageWC","compare","rosterE1","rosterE2","rosterW1","rosterW2","rosterW3"]; production: unit keys, e.g. ["farmer_e","spear_e","xbow_e","hcav_e","siege_e","mage_e","farmer_w","pike_w","bow_w","knight_w","siege_w","mage_w"]'
        default: '["mageWA", "mageWB", "mageWC", "compare"]'
  push:
    branches: ["design/**"]
    paths:
      # only when the render code changes, not when finished images are committed
      - "design/round5/blender/**"
      - "design/round5/common/config.py"

permissions:
  contents: read

concurrency:
  group: design-render-${{ github.ref }}
  cancel-in-progress: true

env:
  BLENDER_VERSION: "5.2.2"
  BLENDER_SERIES: "5.2"
  ROUND: ${{ github.event.inputs.round || 'round5' }}

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(github.event.inputs.targets || '["mageWA", "mageWB", "mageWC", "compare"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download Blender and verify sha256
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          base="https://download.blender.org/release/Blender${BLENDER_SERIES}"
          tarball="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o sums.sha256 "$base/blender-${BLENDER_VERSION}.sha256"
          grep "$tarball" sums.sha256 | sha256sum -c -
          mkdir -p ~/blender
          tar -xf "$tarball" -C ~/blender --strip-components=1

      - name: System libraries and Python packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6 \
            python3-cairo python3-pil python3-numpy
          ~/blender/blender --version | head -1

      - name: Emblems
        working-directory: design/round1
        run: /usr/bin/python3 common/emblems.py "../${ROUND}/build/emblems"

      - name: Render ${{ env.ROUND }} ${{ matrix.target }}
        working-directory: design/${{ env.ROUND }}
        env:
          BLENDER: ${{ github.workspace }}/../blender-bin
        run: |
          ln -sf ~/blender/blender "$BLENDER"
          case "$ROUND" in
            round2) /usr/bin/python3 blender/render_r2.py --level "${{ matrix.target }}" ;;
            round3) /usr/bin/python3 blender/render_r3.py --target "${{ matrix.target }}" ;;
            round4) /usr/bin/python3 blender/render_r4.py --target "${{ matrix.target }}" ;;
            production)
              t="${{ matrix.target }}"
              case "$t" in
                # review-<unit>: only the new animations waiting for the user's approval (facing 7, for the GIF)
                review-*) /usr/bin/python3 blender/render_prod.py --review --target "${t#review-}" ;;
                # render (3x source), post-process at 3x and 2x, then the checks decide the job result
                *)
                  /usr/bin/python3 blender/render_prod.py --target "$t"
                  /usr/bin/python3 common/postprocess.py --target "$t" --scale 3
                  /usr/bin/python3 common/postprocess.py --target "$t" --scale 2
                  /usr/bin/python3 common/checks.py --target "$t" ;;
              esac ;;
            *)      /usr/bin/python3 blender/render_r5.py --target "${{ matrix.target }}" ;;
          esac

      - name: Upload renders
        if: always() && env.ROUND != 'production'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ROUND }}-${{ matrix.target }}
          path: |
            design/${{ env.ROUND }}/build/r*/${{ matrix.target }}/
            design/${{ env.ROUND }}/build/jobs/*.log
          retention-days: 14

      - name: Upload production report (checks, contact sheet, memory)
        if: always() && env.ROUND == 'production'
        uses: actions/upload-artifact@v4
        with:
          name: production-${{ matrix.target }}-report
          path: |
            design/production/build/prod/${{ matrix.target }}/report/
            design/production/build/prod/${{ matrix.target }}/render_stats.json
            design/production/build/prod/${{ matrix.target }}/atlas_x*/memory.json
            design/production/build/jobs/*.log
          retention-days: 90

      - name: Upload production renders and atlases
        if: always() && env.ROUND == 'production'
        uses: actions/upload-artifact@v4
        with:
          # the 3x source renders are kept so the post-processing can be re-run without rendering again
          name: production-${{ matrix.target }}
          path: |
            design/production/build/prod/${{ matrix.target }}/raw/
            design/production/build/prod/${{ matrix.target }}/atlas_x*/
          retention-days: 90
