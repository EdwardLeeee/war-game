# Final design renders (Blender, Cycles CPU) for the ui rounds.
# The developer laptop keeps a 2 GB memory reserve for everyone else, so big or
# supersampled renders run here instead. Not a required check.
# round=buildings-atlas packs a b1 run of the prod_* targets into the building and
# resource-point atlases (design/b1/atlas-buildings.md) and makes the world effects.
# round=release (from main only) packs finished production runs into a GitHub
# Release art-vN for the client (design/release/pack.py).
name: design-render

on:
  workflow_dispatch:
    inputs:
      round:
        description: "round2, round3, round4, round5, production, b1, r7, buildings-atlas or release"
        default: "round5"
      tag:
        description: "release only: the tag, art-vN or art-vN.M (design/release/<tag>.json lists the source runs)"
        default: ""
      publish:
        description: "release only: true publishes the GitHub Release (main only); false only packs, as an artifact"
        default: "false"
      targets:
        description: 'JSON list: buildings-atlas ["<run id of a b1 run of the prod_* targets>", ...] (later runs replace pieces of earlier ones); round2 ["0","A","B","C"]; round3 ["mage0","mageA","mageB","mageC","legs"]; round4 ["mageTA","mageTB","mageTC","farmer"]; round5 ["mageWA","mageWB","mageWC","compare","rosterE1","rosterE2","rosterW1","rosterW2","rosterW3"]; b1: ["core3","states_main_city","states_house","states_barracks","towns_E","towns_W"] (design/b1/common/run.py TARGETS); production: unit keys, "effects", or review-<unit>, e.g. ["farmer_e","spear_e","xbow_e","hcav_e","siege_e","mage_e","farmer_w","pike_w","bow_w","knight_w","siege_w","mage_w"]'
        default: '["mageWA", "mageWB", "mageWC", "compare"]'
  push:
    branches: ["design/**"]
    paths:
      # only when the render code changes, not when finished images are committed
      - "design/round5/blender/**"
      - "design/round5/common/config.py"

permissions:
  contents: read

concurrency:
  # a release is never cancelled half-way by another dispatch
  group: ${{ github.event.inputs.round == 'release' && format('design-release-{0}', github.event.inputs.tag) || format('design-render-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event.inputs.round != 'release' }}

env:
  BLENDER_VERSION: "5.2.2"
  BLENDER_SERIES: "5.2"
  ROUND: ${{ github.event.inputs.round || 'round5' }}
  # R7 version 2's realistic body (THIRD_PARTY_NOTICES.md): MPFB 2.0.18 from extensions.blender.org, sha256 as published
  MPFB_URL: "https://extensions.blender.org/download/sha256:c075b3e9b94b8e5556a5f03f4653602d02ea306de08126e8f55ed6dee28a2dad/add-on-mpfb-v2.0.18.zip?repository=%2Fapi%2Fv1%2Fextensions%2F&blender_version_min=4.2.0"
  MPFB_SHA256: "c075b3e9b94b8e5556a5f03f4653602d02ea306de08126e8f55ed6dee28a2dad"
  # R8's realistic horse (CC0, OpenGameArt; THIRD_PARTY_NOTICES.md): the rigged blend and the textures
  HORSE_BLEND_URL: "https://opengameart.org/sites/default/files/riggedHorse.blend"
  HORSE_BLEND_SHA256: "9cca670b93a74d50e89263e50d55ab035a6c46aa7d2b21e354bdac6987037f4a"
  HORSE_ZIP_URL: "https://opengameart.org/sites/default/files/horse.zip"
  HORSE_ZIP_SHA256: "469704f523c97b18627c14d47dcda69271357f2bb2787309f461b310a0043d27"

jobs:
  render:
    if: github.event.inputs.round != 'release' && github.event.inputs.round != 'buildings-atlas'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(github.event.inputs.targets || '["mageWA", "mageWB", "mageWC", "compare"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download Blender and verify sha256
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          base="https://download.blender.org/release/Blender${BLENDER_SERIES}"
          tarball="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o sums.sha256 "$base/blender-${BLENDER_VERSION}.sha256"
          grep "$tarball" sums.sha256 | sha256sum -c -
          mkdir -p ~/blender
          tar -xf "$tarball" -C ~/blender --strip-components=1

      - name: System libraries and Python packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6 \
            python3-cairo python3-pil python3-numpy
          ~/blender/blender --version | head -1

      - name: Emblems
        working-directory: design/round1
        run: /usr/bin/python3 common/emblems.py "../${ROUND}/build/emblems"

      - name: Render ${{ env.ROUND }} ${{ matrix.target }}
        working-directory: design/${{ env.ROUND }}
        env:
          BLENDER: ${{ github.workspace }}/../blender-bin
        run: |
          ln -sf ~/blender/blender "$BLENDER"
          case "$ROUND" in
            round2) /usr/bin/python3 blender/render_r2.py --level "${{ matrix.target }}" ;;
            round3) /usr/bin/python3 blender/render_r3.py --target "${{ matrix.target }}" ;;
            round4) /usr/bin/python3 blender/render_r4.py --target "${{ matrix.target }}" ;;
            # B1: buildings, towns and resources (design/b1/common/run.py), 3x with 2x supersampling
            # the R8 looks (r8b_*, r8c_*): the CC0 textures and the cliff's rock scans, fetched and checked by sha256
            b1)
              case "${{ matrix.target }}" in
                r8*) /usr/bin/python3 ../r7/common/textures.py fetch && /usr/bin/python3 ../r8/common/scans.py fetch ;;
              esac
              case "${{ matrix.target }}" in
                # the R8 ground (D-093): the five layers baked, the water layer, ground.json (design/r8/common)
                r8g_ground) /usr/bin/python3 ../r8/common/ground_run.py build/b1/r8g ;;
                *) /usr/bin/python3 common/run.py "${{ matrix.target }}" ;;
              esac ;;
            # R7 style test (D-092): v<k>-<unit>, the production unit render in realism version k's look, idle, walk,
            # attack (design/r7/README.md); the CC0 textures and MPFB (version 2) fetched and checked by sha256
            r7)
              t="${{ matrix.target }}"; v="${t%%-*}"; v="${v#v}"; unit="${t#*-}"
              /usr/bin/python3 common/textures.py fetch
              (cd ../round1 && /usr/bin/python3 common/emblems.py ../production/build/emblems)
              if [ "$v" -ge 2 ]; then                     # versions 2 and 8 (R8) use MPFB
                curl -sSfL -o "$RUNNER_TEMP/mpfb.zip" "$MPFB_URL"
                echo "${MPFB_SHA256}  $RUNNER_TEMP/mpfb.zip" | sha256sum -c -
                "$BLENDER" --command extension install-file -r user_default -e "$RUNNER_TEMP/mpfb.zip"
              fi
              if [ "$v" = 8 ] && { [ "$unit" = hcav_e ] || [ "$unit" = knight_w ]; }; then     # R8's horse
                h="$RUNNER_TEMP/horse"; mkdir -p "$h/zip"
                curl -sSfL -o "$h/riggedHorse.blend" "$HORSE_BLEND_URL"
                curl -sSfL -o "$h/horse.zip" "$HORSE_ZIP_URL"
                echo "${HORSE_BLEND_SHA256}  $h/riggedHorse.blend" | sha256sum -c -
                echo "${HORSE_ZIP_SHA256}  $h/horse.zip" | sha256sum -c -
                (cd "$h/zip" && unzip -q ../horse.zip)
                export R8_HORSE="$h"
              fi
              cd ../production
              export R7_VERSION="$v" R7_TEX="$GITHUB_WORKSPACE/design/r7/build/tex"
              # R7's style test rendered idle, walk and attack; R8 (v8) every animation of the unit
              if [ "$v" = 8 ]; then anims=""; else anims="--anims idle,walk,attack"; fi
              /usr/bin/python3 blender/render_prod.py --target "$unit" $anims
              /usr/bin/python3 common/postprocess.py --target "$unit" --scale 3
              /usr/bin/python3 common/postprocess.py --target "$unit" --scale 2 ;;
            production)
              t="${{ matrix.target }}"
              case "$t" in
                # the shared world effects drawn by the game (the dust of a fall), no Blender
                effects) /usr/bin/python3 common/effects.py --scale 3
                         /usr/bin/python3 common/effects.py --scale 2 ;;
                # review-<unit>: only the new animations waiting for the user's approval (facing 7, for the GIF)
                review-*) /usr/bin/python3 blender/render_prod.py --review --target "${t#review-}" ;;
                # render (3x source), post-process at 3x and 2x, then the checks decide the job result
                *)
                  /usr/bin/python3 blender/render_prod.py --target "$t"
                  /usr/bin/python3 common/postprocess.py --target "$t" --scale 3
                  /usr/bin/python3 common/postprocess.py --target "$t" --scale 2
                  /usr/bin/python3 common/checks.py --target "$t" ;;
              esac ;;
            *)      /usr/bin/python3 blender/render_r5.py --target "${{ matrix.target }}" ;;
          esac

      - name: Upload B1 renders
        if: always() && env.ROUND == 'b1'
        uses: actions/upload-artifact@v4
        with:
          name: b1-${{ matrix.target }}
          # several targets write into one folder (states_* -> states): upload what this job rendered
          path: |
            design/b1/build/b1/
            design/b1/build/jobs/*.log
          retention-days: 30

      - name: Upload the R7 style-test atlases
        if: always() && env.ROUND == 'r7'
        uses: actions/upload-artifact@v4
        with:
          name: r7-${{ matrix.target }}
          path: |
            design/production/build/r7v*/prod/*/atlas_x*/
            design/production/build/r7v*/prod/*/clip.json
            design/production/build/r7v*/jobs/*.log
          retention-days: 90

      - name: Upload renders
        if: always() && env.ROUND != 'production' && env.ROUND != 'b1' && env.ROUND != 'r7'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ROUND }}-${{ matrix.target }}
          path: |
            design/${{ env.ROUND }}/build/r*/${{ matrix.target }}/
            design/${{ env.ROUND }}/build/jobs/*.log
          retention-days: 14

      - name: Upload production report (checks, contact sheet, memory)
        if: always() && env.ROUND == 'production'
        uses: actions/upload-artifact@v4
        with:
          name: production-${{ matrix.target }}-report
          path: |
            design/production/build/prod/${{ matrix.target }}/report/
            design/production/build/prod/${{ matrix.target }}/render_stats.json
            design/production/build/prod/${{ matrix.target }}/atlas_x*/memory.json
            design/production/build/jobs/*.log
          retention-days: 90

      - name: Upload production renders and atlases
        if: always() && env.ROUND == 'production'
        uses: actions/upload-artifact@v4
        with:
          # the 3x source renders are kept so the post-processing can be re-run without rendering again
          name: production-${{ matrix.target }}
          path: |
            design/production/build/prod/${{ matrix.target }}/raw/
            design/production/build/prod/${{ matrix.target }}/atlas_x*/
          retention-days: 90

      - name: Upload world effects (effects.json and its page, 3x and 2x)
        if: always() && env.ROUND == 'production' && matrix.target == 'effects'
        uses: actions/upload-artifact@v4
        with:
          name: production-effects-atlas
          path: design/production/build/effects_x*/
          retention-days: 90

  # the building and resource-point atlases from the prod_* renders of a finished b1 run, 3x and 2x
  # (design/b1/common/atlas_b1.py), and the world effects: the dust and the warning circle
  # (design/production/common/effects.py)
  buildings-atlas:
    if: github.event.inputs.round == 'buildings-atlas'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read       # download the renders of the source run
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUNS: ${{ join(fromJSON(github.event.inputs.targets), ' ') }}
    steps:
      - uses: actions/checkout@v4

      - name: Python packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q python3-pil python3-numpy

      - name: Download the prod_* renders of the source runs, in order
        run: |
          mkdir -p design/b1/build/b1/prod
          for run in $SOURCE_RUNS; do
            if ! [[ "$run" =~ ^[0-9]+$ ]]; then
              echo "::error::targets must be run ids, got '$run'"; exit 1
            fi
            gh run download "$run" --pattern 'b1-prod_*' --pattern 'b1-r8*' --dir "$RUNNER_TEMP/renders-$run"
            # art-v6 (R8): the pieces of the r8* targets too (their folders r8p, r8c, r8w, r8n); the ground apart
            for d in "$RUNNER_TEMP/renders-$run"/b1-*; do
              for sub in "$d"/b1/*/; do
                if [ "$(basename "$sub")" = r8g ]; then mkdir -p "$RUNNER_TEMP/ground"; cp -r "$sub"ground/. "$RUNNER_TEMP/ground/"
                else cp -r "$sub". design/b1/build/b1/prod/; fi
              done
            done
          done
          echo "$(ls design/b1/build/b1/prod/*_x3.json | wc -l) pieces"

      - name: Atlases and effects, 3x and 2x
        run: |
          /usr/bin/python3 design/b1/common/atlas_b1.py --scale 3
          /usr/bin/python3 design/b1/common/atlas_b1.py --scale 2
          /usr/bin/python3 design/production/common/effects.py --scale 3
          /usr/bin/python3 design/production/common/effects.py --scale 2
          if [ -f "$RUNNER_TEMP/ground/ground.json" ]; then
            for k in 3 2; do
              /usr/bin/python3 design/r8/common/ground_r8.py export "$RUNNER_TEMP/ground" "design/b1/build/atlas_x$k/ground" "$k"
            done
          fi

      - name: Upload the building atlases
        uses: actions/upload-artifact@v4
        with:
          name: production-buildings
          path: design/b1/build/atlas_x*/
          retention-days: 90

      - name: Upload the world effects
        uses: actions/upload-artifact@v4
        with:
          name: production-effects-atlas
          path: design/production/build/effects_x*/
          retention-days: 90

  # art-vN: the atlases of the runs named in design/release/<tag>.json, as art-vN-x3.tar.gz,
  # art-vN-x2.tar.gz, astc-sample.tar.gz and SHA256SUMS (the format agreed with the client,
  # client/docs/sprite-atlas.md section 2). A published tag is never replaced: a change is a new tag.
  release:
    if: github.event.inputs.round == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write     # create the release and its tag
      actions: read       # download the source runs' artifacts
    env:
      TAG: ${{ github.event.inputs.tag }}
      PUBLISH: ${{ github.event.inputs.publish }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ASTCENC_VERSION: "5.7.0"
      # release-sha256.txt of https://github.com/ARM-software/astc-encoder/releases/tag/5.7.0
      ASTCENC_SHA256: "6c6b299b17608e1ee74db9c491cdc793b12b2b104a4b52222e358d78ae0662a9"
    steps:
      - name: A new art-vN; publishing only from main
        run: |
          if ! [[ "$TAG" =~ ^art-v[0-9]+(\.[0-9]+)?$ ]]; then        # art-vN, or art-vN.M for a small addition
            echo "::error::tag must be art-vN or art-vN.M, got '$TAG'"; exit 1
          fi
          if [ "$PUBLISH" != "true" ]; then
            echo "publish=$PUBLISH: pack only, nothing is published"; exit 0
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::a release is published only from main (this is $GITHUB_REF)"; exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1 ||
             git ls-remote --exit-code --tags "https://github.com/$GH_REPO" "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists; a published tag is never replaced, publish the next number"; exit 1
          fi

      - uses: actions/checkout@v4

      - name: astcenc (official release, sha256 checked)
        run: |
          z="astcenc-${ASTCENC_VERSION}-linux-x64.zip"
          curl -sSfL -o "$RUNNER_TEMP/$z" "https://github.com/ARM-software/astc-encoder/releases/download/${ASTCENC_VERSION}/$z"
          echo "${ASTCENC_SHA256}  $RUNNER_TEMP/$z" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/$z" -d "$RUNNER_TEMP/astcenc"

      - name: Download the source artifacts and pack
        run: |
          python3 design/release/pack.py --tag "$TAG" --work "$RUNNER_TEMP/release" \
            --astcenc "$RUNNER_TEMP/astcenc/bin/astcenc-sse4.1" --commit "$GITHUB_SHA"

      - name: Keep the packed files (in case publishing fails)
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.TAG }}
          path: ${{ runner.temp }}/release/out/
          retention-days: 14

      - name: Publish (a draft first, public once every file is up) and check the public downloads
        if: env.PUBLISH == 'true'
        working-directory: ${{ runner.temp }}/release
        run: |
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md out/*
          gh release edit "$TAG" --draft=false
          mkdir verify
          for f in $(cd out && ls); do
            curl -sSfL --retry 5 --retry-delay 5 --retry-all-errors -o "verify/$f" "https://github.com/$GH_REPO/releases/download/$TAG/$f"
          done
          (cd verify && sha256sum -c SHA256SUMS)
