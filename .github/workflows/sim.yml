name: Sim

# Game rules and the prototype's simple AI (sim/, war-game-core). Not a required check:
# the path filter would leave unrelated pull requests waiting.
on:
  push:
    branches: ["core/**", "ai/scratch-*"]
    paths:
      - "sim/**"
      - ".github/workflows/sim.yml"
  pull_request:
    paths:
      - "sim/**"
      - ".github/workflows/sim.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-vs-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sim/package-lock.json
      - run: npm ci
      - name: 25 games, each replayed
        run: node src/tournament.ts --games 100 --shard ${{ matrix.shard }} --shards 4 --out "${GITHUB_WORKSPACE}/tournament/shard-${{ matrix.shard }}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tournament-shard-${{ matrix.shard }}
          path: tournament/
          retention-days: 30

  ai-vs-ai-random:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        pair: [normal-normal, hard-hard, hard-normal, normal-easy]
        shard: [0, 1, 2, 3]
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sim/package-lock.json
      - run: npm ci
      - name: 25 games on random maps, ${{ matrix.pair }}, each replayed
        run: |
          pair="${{ matrix.pair }}"
          node src/tournament.ts --games 100 --shard ${{ matrix.shard }} --shards 4 --map random --difficulty "${pair/-/,}" --out "${GITHUB_WORKSPACE}/tournament-random/${pair}/shard-${{ matrix.shard }}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          # tournament-random/<pair>/shard-<n>, so the summary's merged download keeps the pairs apart.
          name: tournament-random-${{ matrix.pair }}-shard-${{ matrix.shard }}
          path: tournament-random/
          retention-days: 30

  ai-vs-hard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pair: [hard-normal, hard-hard]
        shard: [0, 1, 2, 3]
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sim/package-lock.json
      - name: Is there a hard AI yet (AI_DIFFICULTIES)?
        id: hard
        run: |
          if node --input-type=module -e 'const m = await import("./src/protocol.ts"); process.exit(m.AI_DIFFICULTIES.includes("hard") ? 0 : 1)' 2>/dev/null; then
            echo "on=true" >> "${GITHUB_OUTPUT}"
          else
            echo "on=false" >> "${GITHUB_OUTPUT}"
            echo "No hard AI in AI_DIFFICULTIES yet: skipped." | tee -a "${GITHUB_STEP_SUMMARY}"
          fi
      - if: steps.hard.outputs.on == 'true'
        run: npm ci
      - name: 25 games, ${{ matrix.pair }}, each replayed
        if: steps.hard.outputs.on == 'true'
        run: |
          pair="${{ matrix.pair }}"
          node src/tournament.ts --games 100 --shard ${{ matrix.shard }} --shards 4 --difficulty "${pair/-/,}" --out "${GITHUB_WORKSPACE}/tournament-${pair}/shard-${{ matrix.shard }}"
      - uses: actions/upload-artifact@v7
        if: always() && steps.hard.outputs.on == 'true'
        with:
          name: tournament-${{ matrix.pair }}-shard-${{ matrix.shard }}
          path: tournament-${{ matrix.pair }}/
          retention-days: 30
