name: Sim

# Game rules and the prototype's simple AI (sim/, war-game-core). Not a required check:
# the path filter would leave unrelated pull requests waiting.
on:
  push:
    branches: ["core/**", "ai/scratch-*"]
    paths:
      - "sim/**"
      - ".github/workflows/sim.yml"
  pull_request:
    paths:
      - "sim/**"
      - ".github/workflows/sim.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sim-${{ github.ref }}
  cancel-in-progress: true

env:
  # AI-against-AI games' time limit (D-112, D-115; the user 2026-10-31: 「我覺得你對打不應該只限制60分鐘」): 120 minutes,
  # its draws gated; the summaries list the old 30 and 60 minutes for reference. The scripted groups' too (--cap).
  AI_TICKS: "144000"

jobs:
  scripted:
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/core/scratch-') || startsWith(github.ref, 'refs/heads/ai/scratch-')
    name: scripted (${{ matrix.difficulty == 'hard' && 'hard ' || '' }}${{ matrix.cell.group }} ${{ matrix.cell.seeds }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { difficulty: hard, cell: { group: ch-on, seeds: 1-20, args: --strategy push --speed h1 --formation close --cap 60 } }
          - { difficulty: hard, cell: { group: ch-off, seeds: 1-20, args: --strategy push --speed h1 --formation close --cap 60 --no-chase-round } }
          - { difficulty: hard, cell: { group: ch-on-random, seeds: 1-20, args: --strategy push --speed h1 --formation close --cap 60 --map random } }
          - { difficulty: hard, cell: { group: ch-off-random, seeds: 1-20, args: --strategy push --speed h1 --formation close --cap 60 --no-chase-round --map random } }
          - { difficulty: hard, cell: { group: cav-on-random, seeds: 1-20, args: --strategy push --speed h1 --formation close --cap 60 --map random --cavalry-share 18 } }
          - { difficulty: hard, cell: { group: cav-off-random, seeds: 1-20, args: --strategy push --speed h1 --formation close --cap 60 --no-chase-round --map random --cavalry-share 18 } }
          - { difficulty: normal, cell: { group: ch-on, seeds: 1-20, args: --strategy push --speed h1 --formation close --cap 60 } }
          - { difficulty: normal, cell: { group: ch-off, seeds: 1-20, args: --strategy push --speed h1 --formation close --cap 60 --no-chase-round } }
          - { difficulty: normal, cell: { group: ch-on-random, seeds: 1-20, args: --strategy push --speed h1 --formation close --cap 60 --map random } }
          - { difficulty: normal, cell: { group: ch-off-random, seeds: 1-20, args: --strategy push --speed h1 --formation close --cap 60 --no-chase-round --map random } }
    env:
      # scripted-<group>-<seeds> against normal (as before), scripted-hard-<group>-<seeds> against hard.
      NAME: scripted-${{ matrix.difficulty == 'hard' && 'hard-' || '' }}${{ matrix.cell.group }}-${{ matrix.cell.seeds }}
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Is there a hard AI yet (AI_DIFFICULTIES)?
        id: hard
        if: matrix.difficulty == 'hard'
        run: |
          if node --input-type=module -e 'const m = await import("./src/protocol.ts"); process.exit(m.AI_DIFFICULTIES.includes("hard") ? 0 : 1)' 2>/dev/null; then
            echo "on=true" >> "${GITHUB_OUTPUT}"
          else
            echo "on=false" >> "${GITHUB_OUTPUT}"
            echo "No hard AI in AI_DIFFICULTIES yet: skipped." | tee -a "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Scripted player against the ${{ matrix.difficulty }} AI
        if: matrix.difficulty == 'normal' || steps.hard.outputs.on == 'true'
        run: |
          set -o pipefail
          node src/scripted-games.ts --seeds ${{ matrix.cell.seeds }} ${{ matrix.cell.args }} --difficulty ${{ matrix.difficulty }} --json "${NAME}.json" | tee -a "${GITHUB_STEP_SUMMARY}"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}
          path: sim/${{ env.NAME }}.json
          retention-days: 30
          if-no-files-found: ignore
