name: Sim

# Game rules and the prototype's simple AI (sim/, war-game-core). Not a required check:
# the path filter would leave unrelated pull requests waiting.
on:
  push:
    branches: ["core/**", "ai/scratch-*"]
    paths:
      - "sim/**"
      - ".github/workflows/sim.yml"
  pull_request:
    paths:
      - "sim/**"
      - ".github/workflows/sim.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sim-${{ github.ref }}
  cancel-in-progress: true

env:
  # AI-against-AI games' time limit (D-112, D-115; the user 2026-10-31: 「我覺得你對打不應該只限制60分鐘」): 120 minutes,
  # its draws gated; the summaries list the old 30 and 60 minutes for reference. The scripted groups' too (--cap).
  AI_TICKS: "144000"

jobs:
  ai-vs-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sim/package-lock.json
      - run: npm ci
      - name: 25 games, each replayed
        run: node src/tournament.ts --games 100 --shard ${{ matrix.shard }} --shards 4 --ticks ${AI_TICKS} --out "${GITHUB_WORKSPACE}/tournament/shard-${{ matrix.shard }}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tournament-shard-${{ matrix.shard }}
          path: tournament/
          retention-days: 30

  # Random maps (D-074): 100 games each of normal against normal, hard against hard, hard against
  # normal and normal against easy, each seed on its own map, the AIs scouting. Gates (D-076,
  # ai-random-summary): every replay matching and each spawn's win rate within 35-65%, for each
  # pair; the stronger AI's share, draws and game lengths are listed only.
  ai-vs-ai-random:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        pair: [normal-normal, hard-hard, hard-normal]
        shard: [0, 1, 2, 3]
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sim/package-lock.json
      - run: npm ci
      - name: 25 games on random maps, ${{ matrix.pair }}, each replayed
        run: |
          pair="${{ matrix.pair }}"
          node src/tournament.ts --games 100 --shard ${{ matrix.shard }} --shards 4 --ticks ${AI_TICKS} --map random --difficulty "${pair/-/,}" --out "${GITHUB_WORKSPACE}/tournament-random/${pair}/shard-${{ matrix.shard }}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          # tournament-random/<pair>/shard-<n>, so the summary's merged download keeps the pairs apart.
          name: tournament-random-${{ matrix.pair }}-shard-${{ matrix.shard }}
          path: tournament-random/
          retention-days: 30

  # What a person meets (round 2): each AI against a player who does nothing, without a time
  # limit, as a timeline (easy must not go for a town before game minute 18); normal and hard
  # for seeds 1-5 with a table of when each town fell and the first march on the main city
  # (round 6; hard once AI_DIFFICULTIES has it, D-052); and the time per tick of 40 soldiers
  # walled in by their own houses.
  scripted:
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/core/scratch-') || startsWith(github.ref, 'refs/heads/ai/scratch-')
    name: scripted (${{ matrix.difficulty == 'hard' && 'hard ' || '' }}${{ matrix.cell.group }} ${{ matrix.cell.seeds }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Against the normal AI, and the hard one once AI_DIFFICULTIES has it (D-052).
        difficulty: [normal, hard]
        cell:
          - { group: push, seeds: 1-40, args: --strategy push --speed h1 --formation close }
          - { group: push-steal-away, seeds: 1-20, args: --strategy push --speed h1 --formation close --late --steal-probe away }
          - { group: push-steal-away, seeds: 21-40, args: --strategy push --speed h1 --formation close --late --steal-probe away }
          - { group: push-steal-home, seeds: 1-20, args: --strategy push --speed h1 --formation close --late --steal-probe home }
          - { group: push-steal-home, seeds: 21-40, args: --strategy push --speed h1 --formation close --late --steal-probe home }
          # Round 6 (D-054): the same push, taking town after town as the user does.
          - { group: push-corners, seeds: 1-40, args: --strategy push --speed h1 --formation close --corners }
          # Round 6 (D-054): the same push, its soldiers left to automatic training.
          - { group: push-auto, seeds: 1-40, args: --strategy push --speed h1 --formation close --auto-train }
          # Round 7 (D-061): automatic training and taking town after town together, and taking
          # town after town but governing every one (governing has to be worth it).
          - { group: push-auto-corners, seeds: 1-40, args: --strategy push --speed h1 --formation close --auto-train --corners }
          - { group: push-corners-govern, seeds: 1-40, args: --strategy push --speed h1 --formation close --corners --govern }
          # Round 8 (D-069): the other pushes governing every town they take, too.
          - { group: push-govern, seeds: 1-40, args: --strategy push --speed h1 --formation close --govern }
          - { group: push-auto-govern, seeds: 1-40, args: --strategy push --speed h1 --formation close --auto-train --govern }
          - { group: push-auto-corners-govern, seeds: 1-40, args: --strategy push --speed h1 --formation close --auto-train --corners --govern }
          # Round 7 (D-061): a cavalry rush, 4 raiders at the AI's farmers before the push.
          # D-072: the user's race past hard's army to its main city (their economy, their way, waiting
          # halfway until hard's army is seen coming); the measure for war-game-ai's fixes to hard.
          # D-080: a tower rush, an outpost manned by 6 spearmen and 2 arrow towers beside the AI's
          # main city, then the push; whether the AI pulls them down is war-game-ai's measure.
          # D-080 (ceo 2026-10-09): the same rush with its 4 farmers alone, no escort, nobody posted;
          # the army plays the push. The AI left farmers alone (war-game-ai): its acceptance group.
          # D-081 (the user's game f1fd2a87): from minute 12 an outpost manned by as many spearmen as it takes
          # (9 since D-119; 6 before) and 5 arrow towers 37 cells from home on the way to the AI's main city,
          # then the push; how many the AI loses by them and how often it bashes on them is war-game-ai's measure.
          # D-081 (ceo 2026-10-10, as the user in f1fd2a87): the army also holds by the fortress until it is
          # 60 strong or minute 30, then the push.
          # D-126 (ceo 2026-11-05): the fortress with nobody posted, its outpost a wall, as the user builds them
          # (32 of his 38 games, 287 outposts, hardly ever manned). Reports only.
          - { group: defend, seeds: 1-20, args: --strategy defend --speed h1 --formation close }
          - { group: defend, seeds: 21-40, args: --strategy defend --speed h1 --formation close }
          # D-074: the push on random maps; the player and the AI both scout.
          - { group: push-random, seeds: 1-20, args: --strategy push --speed h1 --formation close --map random }
          - { group: push-random, seeds: 21-40, args: --strategy push --speed h1 --formation close --map random }
          # D-139 (the user's 64a27f8a): every town taken and governed, on random maps, so the AI may see the player's buildings
          # far from its main city before it finds it (its corner guess).
          # D-097 (war-game-ai): the push with cavalry, about 2 for every 9 foot (the triangle and
          # cavalry riding for the back row, CAV_FLANK); war-game-ai's measure for hard's cavalry.
    env:
      # scripted-<group>-<seeds> against normal (as before), scripted-hard-<group>-<seeds> against hard.
      NAME: scripted-${{ matrix.difficulty == 'hard' && 'hard-' || '' }}${{ matrix.cell.group }}-${{ matrix.cell.seeds }}
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Is there a hard AI yet (AI_DIFFICULTIES)?
        id: hard
        if: matrix.difficulty == 'hard'
        run: |
          if node --input-type=module -e 'const m = await import("./src/protocol.ts"); process.exit(m.AI_DIFFICULTIES.includes("hard") ? 0 : 1)' 2>/dev/null; then
            echo "on=true" >> "${GITHUB_OUTPUT}"
          else
            echo "on=false" >> "${GITHUB_OUTPUT}"
            echo "No hard AI in AI_DIFFICULTIES yet: skipped." | tee -a "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Scripted player against the ${{ matrix.difficulty }} AI
        if: matrix.difficulty == 'normal' || steps.hard.outputs.on == 'true'
        run: |
          set -o pipefail
          node src/scripted-games.ts --seeds ${{ matrix.cell.seeds }} ${{ matrix.cell.args }} --difficulty ${{ matrix.difficulty }} --json "${NAME}.json" | tee -a "${GITHUB_STEP_SUMMARY}"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}
          path: sim/${{ env.NAME }}.json
          retention-days: 30
          if-no-files-found: ignore

  # The five groups in one table: games won of the first 15 seeds (20 for push), as the table had
  # before D-049, and of all 40; games still open at the cap in brackets.
  scripted-summary:
    needs: [scripted]
    if: always() && (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/core/scratch-') || startsWith(github.ref, 'refs/heads/ai/scratch-'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/download-artifact@v7
        with:
          pattern: scripted-*
          path: scripted
          merge-multiple: true
      - name: The five groups
        run: |
          set -o pipefail
          cat > summary.mjs <<'EOF'
          import { readdirSync, readFileSync } from "node:fs";
          const groups = [["push", "主動", 20], ["push-corners", "主動（一直搶城鎮）", 20], ["push-auto", "主動（自動訓練）", 20], ["push-auto-corners", "主動（自動訓練＋一直搶城鎮）", 20], ["push-corners-govern", "主動（一直搶城鎮，打下來就治理）", 20], ["push-govern", "主動（打下來就治理）", 20], ["push-auto-govern", "主動（自動訓練，打下來就治理）", 20], ["push-auto-corners-govern", "主動（自動訓練＋一直搶城鎮，打下來就治理）", 20], ["push-raid", "主動（騎兵突襲）", 20], ["push-race", "主動（偷家）", 20], ["push-towerrush", "主動（塔攻，護送）", 20], ["push-towerrush-farmers", "主動（塔攻，只派村民）", 20], ["push-fortress", "主動（半路要塞）", 20], ["push-fortress-random", "主動（半路要塞），隨機地圖", 20], ["push-fortress-hold", "主動（半路要塞，大軍守著）", 20], ["push-fortress-hold-random", "主動（半路要塞，大軍守著），隨機地圖", 20], ["push-fortress-wall", "主動（半路要塞，哨所當牆、不駐守）", 20], ["push-fortress-wall-random", "主動（半路要塞，哨所當牆、不駐守），隨機地圖", 20], ["defend", "守家", 15], ["defend-loose", "守家散開", 15], ["defend-eco", "守家經濟養大散開", 15], ["notown", "不拿城鎮", 15], ["push-random", "主動，隨機地圖", 20], ["push-corners-govern-random", "主動（一直搶城鎮，打下來就治理），隨機地圖", 20], ["push-cavalry", "主動（帶騎兵）", 20], ["push-cavalry-random", "主動（帶騎兵），隨機地圖", 20]];
          // scripted-<group>-<seeds>.json against normal, scripted-hard-<group>-<seeds>.json against hard.
          const levels = [["", "普通"], ["hard-", "困難"]];
          const games = new Map(levels.flatMap(([l]) => groups.map(([g]) => [l + g, []])));
          for (const f of readdirSync("scripted")) {
            const m = /^scripted-(.+)-\d+-\d+\.json$/.exec(f);
            if (m && games.has(m[1])) games.get(m[1]).push(...JSON.parse(readFileSync(`scripted/${f}`, "utf8")).games);
          }
          const cell = (list) => {
            const won = list.filter((x) => x.result === "won").length;
            const open = list.filter((x) => x.result === "open").length;
            return `${won}/${list.length}${open > 0 ? `（${open}）` : ""}`;
          };
          const out = [];
          for (const [l, level] of levels) {
            if (groups.every(([g]) => games.get(l + g).length === 0)) continue;
            out.push(`## 腳本玩家五組（對${level}電腦）`, "", "| 組 | 前 15／20 局 | 40 局 |", "|---|---|---|");
            for (const [g, name, first] of groups) {
              const list = games.get(l + g).sort((a, b) => a.seed - b.seed);
              out.push(`| ${name}（${g}） | ${cell(list.filter((x) => x.seed <= first))} | ${cell(list)} |`);
            }
            out.push("");
          }
          out.push("贏/局數；括號是到上限（120 分）還沒分出勝負的局。前 15／20 局是 D-049 以前 CI 跑的局，逐局相同。");
          console.log(out.join("\n"));
          EOF
          node summary.mjs | tee -a "${GITHUB_STEP_SUMMARY}"
      # D-139: an idle army, the AI's side of every group (sim/src/idle-watch.ts). Reports only.
      - name: An idle army
        working-directory: sim
        run: |
          set -o pipefail
          node src/idle-summary.ts --scripted ../scripted | tee -a "${GITHUB_STEP_SUMMARY}"

  # D-086 A (war-game-ai, docs/research/2026-10-ai-late.md): the user's long wins against hard as a
  # scripted group (--late), on both maps, against normal and hard, seeds 1-40 in two jobs each.
  # Reports only, no threshold; its own jobs, so the jobs above play as before.
  ai-vs-hard:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        pair: [hard-normal, hard-hard]
        shard: [0, 1, 2, 3]
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sim/package-lock.json
      - name: Is there a hard AI yet (AI_DIFFICULTIES)?
        id: hard
        run: |
          if node --input-type=module -e 'const m = await import("./src/protocol.ts"); process.exit(m.AI_DIFFICULTIES.includes("hard") ? 0 : 1)' 2>/dev/null; then
            echo "on=true" >> "${GITHUB_OUTPUT}"
          else
            echo "on=false" >> "${GITHUB_OUTPUT}"
            echo "No hard AI in AI_DIFFICULTIES yet: skipped." | tee -a "${GITHUB_STEP_SUMMARY}"
          fi
      - if: steps.hard.outputs.on == 'true'
        run: npm ci
      - name: 25 games, ${{ matrix.pair }}, each replayed
        if: steps.hard.outputs.on == 'true'
        run: |
          pair="${{ matrix.pair }}"
          node src/tournament.ts --games 100 --shard ${{ matrix.shard }} --shards 4 --ticks ${AI_TICKS} --difficulty "${pair/-/,}" --out "${GITHUB_WORKSPACE}/tournament-${pair}/shard-${{ matrix.shard }}"
      - uses: actions/upload-artifact@v7
        if: always() && steps.hard.outputs.on == 'true'
        with:
          name: tournament-${{ matrix.pair }}-shard-${{ matrix.shard }}
          path: tournament-${{ matrix.pair }}/
          retention-days: 30

  # Gates as for the others; hard against normal: hard wins at least 65% of the decided games
  # (D-052's brief, src/tournament-summary.ts).
  ai-hard-summary:
    needs: [ai-vs-hard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Is there a hard AI yet (AI_DIFFICULTIES)?
        id: hard
        run: |
          if node --input-type=module -e 'const m = await import("./src/protocol.ts"); process.exit(m.AI_DIFFICULTIES.includes("hard") ? 0 : 1)' 2>/dev/null; then
            echo "on=true" >> "${GITHUB_OUTPUT}"
          else
            echo "on=false" >> "${GITHUB_OUTPUT}"
            echo "No hard AI in AI_DIFFICULTIES yet: skipped." | tee -a "${GITHUB_STEP_SUMMARY}"
          fi
      - uses: actions/download-artifact@v7
        if: steps.hard.outputs.on == 'true'
        with:
          pattern: tournament-hard-normal-shard-*
          path: tournament-hard-normal
          merge-multiple: true
      - uses: actions/download-artifact@v7
        if: steps.hard.outputs.on == 'true'
        with:
          pattern: tournament-hard-hard-shard-*
          path: tournament-hard-hard
          merge-multiple: true
      - name: Summary and gates, hard against normal
        if: steps.hard.outputs.on == 'true'
        run: |
          set -o pipefail
          { echo "## 困難對普通"; node src/tournament-summary.ts ../tournament-hard-normal/shard-* --json ../tournament-hard-normal/summary.json; } | tee -a "${GITHUB_STEP_SUMMARY}"
      - name: Summary and gates, hard against hard
        if: always() && steps.hard.outputs.on == 'true'
        run: |
          set -o pipefail
          { echo "## 困難對困難"; node src/tournament-summary.ts ../tournament-hard-hard/shard-* --json ../tournament-hard-hard/summary.json; } | tee -a "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@v7
        if: always() && steps.hard.outputs.on == 'true'
        with:
          name: tournament-summary-hard-normal
          path: tournament-hard-normal/summary.json
          retention-days: 30
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always() && steps.hard.outputs.on == 'true'
        with:
          name: tournament-summary-hard-hard
          path: tournament-hard-hard/summary.json
          retention-days: 30
          if-no-files-found: ignore

  # The same command logs give the same hashes in Node, Chromium and WebKit: three AI-vs-AI
  # games played in Node, replayed in the browser from the simulation's own sources.
  ai-random-summary:
    needs: [ai-vs-ai-random]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/download-artifact@v7
        with:
          pattern: tournament-random-*-shard-*
          path: tournament-random
          merge-multiple: true
      - name: Summary, random maps
        run: |
          set -o pipefail
          ok=0
          for pair in normal-normal hard-hard hard-normal; do
            { echo "## 隨機地圖：${pair}"; node src/tournament-summary.ts ../tournament-random/${pair}/shard-* --json ../tournament-random/summary-${pair}.json; } | tee -a "${GITHUB_STEP_SUMMARY}" || ok=1
          done
          exit $ok
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tournament-random-summary
          path: tournament-random/summary-*.json
          retention-days: 30
