name: Sim

# Game rules and the prototype's simple AI (sim/, war-game-core). Not a required check:
# the path filter would leave unrelated pull requests waiting.
on:
  push:
    branches: ["core/**", "ai/scratch-*"]
    paths:
      - "sim/**"
      - ".github/workflows/sim.yml"
  pull_request:
    paths:
      - "sim/**"
      - ".github/workflows/sim.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sim/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Full-length games without a screen, each replayed from its command log (every hash must
  # match). Until the AI arrives (PR-5) fixed scripts play: `demo` moves the skirmish armies,
  # `eco` plays both sides' economy for a whole 36,000-tick game.
  headless:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sim/package-lock.json
      - run: npm ci
      # D-083: perf200 and perf360 (both sides full at 200 / 360) beside perf (114 / 120), on the same machine.
      - name: Skirmish, economy, e2e, perf and standard games, replayed
        run: |
          set -euo pipefail
          out="${GITHUB_WORKSPACE}/headless"
          lscpu | sed -n 's/^Model name: *//p'
          node src/headless.ts --scenario skirmish --script demo --ticks 12000 --out "${out}/skirmish"
          node src/headless.ts --replay "${out}/skirmish/commands.jsonl" --ticks 12000 --out "${out}/skirmish-replay"
          diff "${out}/skirmish/hashes.txt" "${out}/skirmish-replay/hashes.txt"
          echo "skirmish replay: every hash matches ($(wc -l < "${out}/skirmish/hashes.txt") checkpoints)"
          node src/headless.ts --scenario standard --script eco --ai 0,0 --out "${out}/eco"
          node src/headless.ts --replay "${out}/eco/commands.jsonl" --out "${out}/eco-replay"
          diff "${out}/eco/hashes.txt" "${out}/eco-replay/hashes.txt"
          echo "economy replay: every hash matches ($(wc -l < "${out}/eco/hashes.txt") checkpoints)"
          node src/headless.ts --scenario e2e --ai 0,0 --ticks 6000 --out "${out}/e2e"
          node src/headless.ts --scenario perf --ai 0,0 --ticks 6000 --out "${out}/perf"
          node src/headless.ts --scenario perf200 --ai 0,0 --ticks 6000 --out "${out}/perf200"
          node src/headless.ts --scenario perf360 --ai 0,0 --ticks 6000 --out "${out}/perf360"
          node src/headless.ts --scenario standard --ai 0,0 --out "${out}/standard" --expected "${out}/expected-standard.json"
          { echo "### Headless"; for d in skirmish skirmish-replay eco eco-replay e2e perf perf200 perf360 standard; do echo "- ${d}: \`$(tr -d '\n' < "${out}/${d}/timing.json" | tr -s ' ')\`"; done; } >> "${GITHUB_STEP_SUMMARY}"
      # D-083: how long 繼續上一局 takes to run an 80-minute game (96,000 ticks) again from its log.
      - name: Continue an 80-minute game from its log
        run: |
          set -o pipefail
          lscpu | sed -n 's/^Model name: *//p'
          { echo "### Continue"; node src/continue-bench.ts --ticks 96000 | sed 's/^/- /'; } | tee -a "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@v7
        with:
          name: sim-headless
          path: headless/
          retention-days: 30

  # 100 AI-vs-AI games (50 seeds x both spawns), 4 shards of 25; each game is replayed from
  # its command log with the AIs off and every hash must match.
  ai-vs-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sim/package-lock.json
      - run: npm ci
      - name: 25 games, each replayed
        run: node src/tournament.ts --games 100 --shard ${{ matrix.shard }} --shards 4 --out "${GITHUB_WORKSPACE}/tournament/shard-${{ matrix.shard }}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tournament-shard-${{ matrix.shard }}
          path: tournament/
          retention-days: 30

  # Random maps (D-074): 100 games each of normal against normal, hard against hard, hard against
  # normal and normal against easy, each seed on its own map, the AIs scouting. Gates (D-076,
  # ai-random-summary): every replay matching and each spawn's win rate within 35-65%, for each
  # pair; the stronger AI's share, draws and game lengths are listed only.
  ai-vs-ai-random:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        pair: [normal-normal, hard-hard, hard-normal, normal-easy]
        shard: [0, 1, 2, 3]
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sim/package-lock.json
      - run: npm ci
      - name: 25 games on random maps, ${{ matrix.pair }}, each replayed
        run: |
          pair="${{ matrix.pair }}"
          node src/tournament.ts --games 100 --shard ${{ matrix.shard }} --shards 4 --map random --difficulty "${pair/-/,}" --out "${GITHUB_WORKSPACE}/tournament-random/${pair}/shard-${{ matrix.shard }}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          # tournament-random/<pair>/shard-<n>, so the summary's merged download keeps the pairs apart.
          name: tournament-random-${{ matrix.pair }}-shard-${{ matrix.shard }}
          path: tournament-random/
          retention-days: 30

  # What a person meets (round 2): each AI against a player who does nothing, without a time
  # limit, as a timeline (easy must not go for a town before game minute 18); normal and hard
  # for seeds 1-5 with a table of when each town fell and the first march on the main city
  # (round 6; hard once AI_DIFFICULTIES has it, D-052); and the time per tick of 40 soldiers
  # walled in by their own houses.
  ai-timeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sim/package-lock.json
      - run: npm ci
      - name: Easy and normal against a player who does nothing; walled-in soldiers
        run: |
          set -o pipefail
          node src/ai-timeline.ts --seed 4 --difficulty easy --first-town-min 18 | tee -a "${GITHUB_STEP_SUMMARY}"
          node src/ai-timeline.ts --seeds 1-5 --difficulty normal | tee -a "${GITHUB_STEP_SUMMARY}"
          node src/walled-perf.ts | tee -a "${GITHUB_STEP_SUMMARY}"
      - name: Is there a hard AI yet (AI_DIFFICULTIES)?
        id: hard
        run: |
          if node --input-type=module -e 'const m = await import("./src/protocol.ts"); process.exit(m.AI_DIFFICULTIES.includes("hard") ? 0 : 1)' 2>/dev/null; then
            echo "on=true" >> "${GITHUB_OUTPUT}"
          else
            echo "on=false" >> "${GITHUB_OUTPUT}"
            echo "No hard AI in AI_DIFFICULTIES yet: skipped." | tee -a "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Hard against a player who does nothing
        if: steps.hard.outputs.on == 'true'
        run: |
          set -o pipefail
          node src/ai-timeline.ts --seeds 1-5 --difficulty hard | tee -a "${GITHUB_STEP_SUMMARY}"

  # The scripted player against the normal AI, and the hard one once there is one (D-052) (D-045,
  # D-046; src/scripted-games.ts): five fixed
  # ways a person might play, seeds 1-40 each (D-049: 15 seeds overstated a difference that 40
  # did not), game by game; the long groups split over jobs, all five in one table in
  # scripted-summary, the first 15 or 20 seeds beside all 40. Reports only, no threshold.
  # Only in pull request runs and pushes to core/scratch-* and ai/scratch-* (analysis branches of
  # war-game-core and war-game-ai, D-052): the push run of a pull request's branch would play the
  # same games again.
  scripted:
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/core/scratch-') || startsWith(github.ref, 'refs/heads/ai/scratch-')
    name: scripted (${{ matrix.difficulty == 'hard' && 'hard ' || '' }}${{ matrix.cell.group }} ${{ matrix.cell.seeds }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Against the normal AI, and the hard one once AI_DIFFICULTIES has it (D-052).
        difficulty: [normal, hard]
        cell:
          - { group: push, seeds: 1-40, args: --strategy push --speed h1 --formation close }
          # Round 6 (D-054): the same push, taking town after town as the user does.
          - { group: push-corners, seeds: 1-40, args: --strategy push --speed h1 --formation close --corners }
          # Round 6 (D-054): the same push, its soldiers left to automatic training.
          - { group: push-auto, seeds: 1-40, args: --strategy push --speed h1 --formation close --auto-train }
          # Round 7 (D-061): automatic training and taking town after town together, and taking
          # town after town but governing every one (governing has to be worth it).
          - { group: push-auto-corners, seeds: 1-40, args: --strategy push --speed h1 --formation close --auto-train --corners }
          - { group: push-corners-govern, seeds: 1-40, args: --strategy push --speed h1 --formation close --corners --govern }
          # Round 8 (D-069): the other pushes governing every town they take, too.
          - { group: push-govern, seeds: 1-40, args: --strategy push --speed h1 --formation close --govern }
          - { group: push-auto-govern, seeds: 1-40, args: --strategy push --speed h1 --formation close --auto-train --govern }
          - { group: push-auto-corners-govern, seeds: 1-40, args: --strategy push --speed h1 --formation close --auto-train --corners --govern }
          # Round 7 (D-061): a cavalry rush, 4 raiders at the AI's farmers before the push.
          - { group: push-raid, seeds: 1-40, args: --strategy push --speed h1 --formation close --raid 4 }
          # D-072: the user's race past hard's army to its main city (their economy, their way, waiting
          # halfway until hard's army is seen coming); the measure for war-game-ai's fixes to hard.
          - { group: push-race, seeds: 1-40, args: --strategy push --speed h1 --formation close --user-eco --race edge --race-stage --race-at 99 --race-by 11.5 }
          # D-080: a tower rush, an outpost manned by 6 spearmen and 2 arrow towers beside the AI's
          # main city, then the push; whether the AI pulls them down is war-game-ai's measure.
          - { group: push-towerrush, seeds: 1-40, args: --strategy push --speed h1 --formation close --tower-rush 6 }
          # D-080 (ceo 2026-10-09): the same rush with its 4 farmers alone, no escort, nobody posted;
          # the army plays the push. The AI left farmers alone (war-game-ai): its acceptance group.
          - { group: push-towerrush-farmers, seeds: 1-40, args: --strategy push --speed h1 --formation close --tower-rush-farmers }
          # D-081 (the user's game f1fd2a87): from minute 12 an outpost manned by 6 spearmen and 5 arrow
          # towers 37 cells from home on the way to the AI's main city, then the push; how many the AI
          # loses by them and how often it bashes on them is war-game-ai's measure.
          - { group: push-fortress, seeds: 1-40, args: --strategy push --speed h1 --formation close --fortress }
          - { group: push-fortress-random, seeds: 1-20, args: --strategy push --speed h1 --formation close --fortress --map random }
          - { group: push-fortress-random, seeds: 21-40, args: --strategy push --speed h1 --formation close --fortress --map random }
          # D-081 (ceo 2026-10-10, as the user in f1fd2a87): the army also holds by the fortress until it is
          # 60 strong or minute 30, then the push.
          - { group: push-fortress-hold, seeds: 1-40, args: --strategy push --speed h1 --formation close --fortress-hold 60 }
          - { group: push-fortress-hold-random, seeds: 1-20, args: --strategy push --speed h1 --formation close --fortress-hold 60 --map random }
          - { group: push-fortress-hold-random, seeds: 21-40, args: --strategy push --speed h1 --formation close --fortress-hold 60 --map random }
          - { group: defend, seeds: 1-20, args: --strategy defend --speed h1 --formation close }
          - { group: defend, seeds: 21-40, args: --strategy defend --speed h1 --formation close }
          - { group: defend-loose, seeds: 1-20, args: --strategy defend --speed h1 --formation all }
          - { group: defend-loose, seeds: 21-40, args: --strategy defend --speed h1 --formation all }
          - { group: defend-eco, seeds: 1-14, args: --strategy defend --speed eco --formation all }
          - { group: defend-eco, seeds: 15-27, args: --strategy defend --speed eco --formation all }
          - { group: defend-eco, seeds: 28-40, args: --strategy defend --speed eco --formation all }
          - { group: notown, seeds: 1-40, args: --strategy notown --speed h1 --formation close }
          # D-074: the push on random maps; the player and the AI both scout.
          - { group: push-random, seeds: 1-20, args: --strategy push --speed h1 --formation close --map random }
          - { group: push-random, seeds: 21-40, args: --strategy push --speed h1 --formation close --map random }
    env:
      # scripted-<group>-<seeds> against normal (as before), scripted-hard-<group>-<seeds> against hard.
      NAME: scripted-${{ matrix.difficulty == 'hard' && 'hard-' || '' }}${{ matrix.cell.group }}-${{ matrix.cell.seeds }}
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Is there a hard AI yet (AI_DIFFICULTIES)?
        id: hard
        if: matrix.difficulty == 'hard'
        run: |
          if node --input-type=module -e 'const m = await import("./src/protocol.ts"); process.exit(m.AI_DIFFICULTIES.includes("hard") ? 0 : 1)' 2>/dev/null; then
            echo "on=true" >> "${GITHUB_OUTPUT}"
          else
            echo "on=false" >> "${GITHUB_OUTPUT}"
            echo "No hard AI in AI_DIFFICULTIES yet: skipped." | tee -a "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Scripted player against the ${{ matrix.difficulty }} AI
        if: matrix.difficulty == 'normal' || steps.hard.outputs.on == 'true'
        run: |
          set -o pipefail
          node src/scripted-games.ts --seeds ${{ matrix.cell.seeds }} ${{ matrix.cell.args }} --difficulty ${{ matrix.difficulty }} --json "${NAME}.json" | tee -a "${GITHUB_STEP_SUMMARY}"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}
          path: sim/${{ env.NAME }}.json
          retention-days: 30
          if-no-files-found: ignore

  # The five groups in one table: games won of the first 15 seeds (20 for push), as the table had
  # before D-049, and of all 40; games still open at the cap in brackets.
  scripted-summary:
    needs: [scripted]
    if: always() && (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/core/scratch-') || startsWith(github.ref, 'refs/heads/ai/scratch-'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/download-artifact@v7
        with:
          pattern: scripted-*
          path: scripted
          merge-multiple: true
      - name: The five groups
        run: |
          set -o pipefail
          cat > summary.mjs <<'EOF'
          import { readdirSync, readFileSync } from "node:fs";
          const groups = [["push", "主動", 20], ["push-corners", "主動（一直搶城鎮）", 20], ["push-auto", "主動（自動訓練）", 20], ["push-auto-corners", "主動（自動訓練＋一直搶城鎮）", 20], ["push-corners-govern", "主動（一直搶城鎮，打下來就治理）", 20], ["push-govern", "主動（打下來就治理）", 20], ["push-auto-govern", "主動（自動訓練，打下來就治理）", 20], ["push-auto-corners-govern", "主動（自動訓練＋一直搶城鎮，打下來就治理）", 20], ["push-raid", "主動（騎兵突襲）", 20], ["push-race", "主動（偷家）", 20], ["push-towerrush", "主動（塔攻，護送）", 20], ["push-towerrush-farmers", "主動（塔攻，只派村民）", 20], ["push-fortress", "主動（半路要塞）", 20], ["push-fortress-random", "主動（半路要塞），隨機地圖", 20], ["push-fortress-hold", "主動（半路要塞，大軍守著）", 20], ["push-fortress-hold-random", "主動（半路要塞，大軍守著），隨機地圖", 20], ["defend", "守家", 15], ["defend-loose", "守家散開", 15], ["defend-eco", "守家經濟養大散開", 15], ["notown", "不拿城鎮", 15], ["push-random", "主動，隨機地圖", 20]];
          // scripted-<group>-<seeds>.json against normal, scripted-hard-<group>-<seeds>.json against hard.
          const levels = [["", "普通"], ["hard-", "困難"]];
          const games = new Map(levels.flatMap(([l]) => groups.map(([g]) => [l + g, []])));
          for (const f of readdirSync("scripted")) {
            const m = /^scripted-(.+)-\d+-\d+\.json$/.exec(f);
            if (m && games.has(m[1])) games.get(m[1]).push(...JSON.parse(readFileSync(`scripted/${f}`, "utf8")).games);
          }
          const cell = (list) => {
            const won = list.filter((x) => x.result === "won").length;
            const open = list.filter((x) => x.result === "open").length;
            return `${won}/${list.length}${open > 0 ? `（${open}）` : ""}`;
          };
          const out = [];
          for (const [l, level] of levels) {
            if (groups.every(([g]) => games.get(l + g).length === 0)) continue;
            out.push(`## 腳本玩家五組（對${level}電腦）`, "", "| 組 | 前 15／20 局 | 40 局 |", "|---|---|---|");
            for (const [g, name, first] of groups) {
              const list = games.get(l + g).sort((a, b) => a.seed - b.seed);
              out.push(`| ${name}（${g}） | ${cell(list.filter((x) => x.seed <= first))} | ${cell(list)} |`);
            }
            out.push("");
          }
          out.push("贏/局數；括號是到第 50 分還沒分出勝負的局。前 15／20 局是 D-049 以前 CI 跑的局，逐局相同。");
          console.log(out.join("\n"));
          EOF
          node summary.mjs | tee -a "${GITHUB_STEP_SUMMARY}"

  # D-086 A (war-game-ai, docs/research/2026-10-ai-late.md): the user's long wins against hard as a
  # scripted group (--late), on both maps, against normal and hard, seeds 1-40 in two jobs each.
  # Reports only, no threshold; its own jobs, so the jobs above play as before.
  scripted-late:
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/core/scratch-') || startsWith(github.ref, 'refs/heads/ai/scratch-')
    name: scripted late (${{ matrix.difficulty }} ${{ matrix.cell.group }} ${{ matrix.cell.seeds }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        difficulty: [normal, hard]
        cell:
          - { group: push-late, seeds: 1-20, args: --strategy push --speed h1 --formation close --late }
          - { group: push-late, seeds: 21-40, args: --strategy push --speed h1 --formation close --late }
          - { group: push-late-random, seeds: 1-20, args: --strategy push --speed h1 --formation close --late --map random }
          - { group: push-late-random, seeds: 21-40, args: --strategy push --speed h1 --formation close --late --map random }
    env:
      NAME: late-${{ matrix.difficulty }}-${{ matrix.cell.group }}-${{ matrix.cell.seeds }}
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Scripted player (late) against the ${{ matrix.difficulty }} AI
        run: |
          set -o pipefail
          node src/scripted-games.ts --seeds ${{ matrix.cell.seeds }} ${{ matrix.cell.args }} --difficulty ${{ matrix.difficulty }} --json "${NAME}.json" | tee -a "${GITHUB_STEP_SUMMARY}"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}
          path: sim/${{ env.NAME }}.json
          retention-days: 30
          if-no-files-found: ignore

  # The late group in one table (ceo 2026-10-18): won after minute 27 with a march of the AI's on the
  # player's main city beaten off before, and where the armies stood at minutes 15 and 20.
  scripted-late-summary:
    needs: [scripted-late]
    if: always() && (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/core/scratch-') || startsWith(github.ref, 'refs/heads/ai/scratch-'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/download-artifact@v7
        with:
          pattern: late-*
          path: late
          merge-multiple: true
      - name: The late group
        run: |
          set -o pipefail
          cat > late.mjs <<'EOF'
          import { readdirSync, readFileSync } from "node:fs";
          const rows = [["normal", "push-late", "普通，固定地圖"], ["normal", "push-late-random", "普通，隨機地圖"], ["hard", "push-late", "困難，固定地圖"], ["hard", "push-late-random", "困難，隨機地圖"]];
          const med = (l) => (l.length === 0 ? "—" : String([...l].sort((a, b) => a - b)[l.length >> 1]));
          const out = ["## 後期翻盤（D-086）", "", "| 對手、地圖 | 贏／局數 | 重現 | 贏在 27 分以後 | 電腦出兵沒打下的局 | 第 15 分電腦兵是我的幾倍 | 第 20 分兵 我／電腦 | 第 20 分電腦比我少 |", "|---|---|---|---|---|---|---|---|"];
          for (const [level, group, name] of rows) {
            const games = readdirSync("late")
              .filter((f) => f.startsWith(`late-${level}-${group}-`) && /^late-[a-z]+-[a-z-]+-\d+-\d+\.json$/.test(f) && f.replace(/-\d+-\d+\.json$/, "") === `late-${level}-${group}`)
              .flatMap((f) => JSON.parse(readFileSync(`late/${f}`, "utf8")).games);
            if (games.length === 0) continue;
            const failed = (x) => x.aiMarches.some((a) => !a.fell);
            const won = games.filter((x) => x.result === "won");
            const late = won.filter((x) => x.endTick > 27 * 1200);
            const at15 = games.map((x) => x.armyAt.m15).filter((x) => x !== null);
            const at20 = games.map((x) => x.armyAt.m20).filter((x) => x !== null);
            const ratio = at15.filter(([p]) => p > 0).map(([p, a]) => Math.round((a * 100) / p) / 100);
            out.push(
              `| ${name} | ${won.length}/${games.length} | ${late.filter(failed).length} | ${late.length} | ${games.filter(failed).length} | ${med(ratio)}（我沒兵 ${at15.length - ratio.length} 局） | ${med(at20.map((x) => x[0]))}／${med(at20.map((x) => x[1]))}（${at20.length} 局） | ${at20.filter(([p, a]) => a < p).length} |`,
            );
          }
          out.push("", "重現：贏在第 27 分以後，而且之前電腦至少一次帶 10 名以上出發打我的主城、沒打下來（隔不到 2 分鐘的出兵算同一次）。第 15、20 分的兵不含村民；中位數。");
          console.log(out.join("\n"));
          EOF
          node late.mjs | tee -a "${GITHUB_STEP_SUMMARY}"

  # D-086 A3 (war-game-ai, docs/research/2026-10-ai-late.md): the late group with a squad of 10 that goes
  # for the AI's farmers far from its main city from minute 10 (--late --harass 10; the user's 75830947),
  # on both maps, against normal and hard, seeds 1-40 in two jobs each. Reports only, no threshold; its
  # own jobs, so the jobs above play as before.
  scripted-harass:
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/core/scratch-') || startsWith(github.ref, 'refs/heads/ai/scratch-')
    name: scripted harass (${{ matrix.difficulty }} ${{ matrix.cell.group }} ${{ matrix.cell.seeds }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        difficulty: [normal, hard]
        cell:
          - { group: push-late-harass, seeds: 1-20, args: --strategy push --speed h1 --formation close --late --harass 10 }
          - { group: push-late-harass, seeds: 21-40, args: --strategy push --speed h1 --formation close --late --harass 10 }
          - { group: push-late-harass-random, seeds: 1-20, args: --strategy push --speed h1 --formation close --late --harass 10 --map random }
          - { group: push-late-harass-random, seeds: 21-40, args: --strategy push --speed h1 --formation close --late --harass 10 --map random }
    env:
      NAME: harass-${{ matrix.difficulty }}-${{ matrix.cell.group }}-${{ matrix.cell.seeds }}
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Scripted player (late, harass) against the ${{ matrix.difficulty }} AI
        run: |
          set -o pipefail
          node src/scripted-games.ts --seeds ${{ matrix.cell.seeds }} ${{ matrix.cell.args }} --difficulty ${{ matrix.difficulty }} --json "${NAME}.json" | tee -a "${GITHUB_STEP_SUMMARY}"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}
          path: sim/${{ env.NAME }}.json
          retention-days: 30
          if-no-files-found: ignore

  # The harass group in one table: the AI's farmers lost, hit and back, idle at home and hiding, and
  # what the AI counted of its own rescues (hard's stats(), when it has one).
  scripted-harass-summary:
    needs: [scripted-harass]
    if: always() && (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/core/scratch-') || startsWith(github.ref, 'refs/heads/ai/scratch-'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/download-artifact@v7
        with:
          pattern: harass-*
          path: harass
          merge-multiple: true
      - name: The harass group
        run: |
          set -o pipefail
          cat > harass.mjs <<'EOF'
          import { readdirSync, readFileSync } from "node:fs";
          const rows = [["normal", "push-late-harass", "普通，固定地圖"], ["normal", "push-late-harass-random", "普通，隨機地圖"], ["hard", "push-late-harass", "困難，固定地圖"], ["hard", "push-late-harass-random", "困難，隨機地圖"]];
          const med = (l) => (l.length === 0 ? "—" : String([...l].sort((a, b) => a - b)[l.length >> 1]));
          const sum = (l) => l.reduce((a, c) => a + c, 0);
          const out = ["## 殺村民（D-086 A3）", "", "| 對手、地圖 | 贏／局數 | 一局多長（分） | 電腦每局死的村民 | 被打／3 分鐘後補回 | 在家閒著（村民·分鐘） | 躲進主城（村民·分鐘） | 電腦自己的救援紀錄 |", "|---|---|---|---|---|---|---|---|"];
          for (const [level, group, name] of rows) {
            const games = readdirSync("harass")
              .filter((f) => f.replace(/-\d+-\d+\.json$/, "") === `harass-${level}-${group}`)
              .flatMap((f) => JSON.parse(readFileSync(`harass/${f}`, "utf8")).games);
            if (games.length === 0) continue;
            const won = games.filter((x) => x.result === "won");
            const lost = games.map((x) => sum(x.aiFarmers.lost));
            const rescue = games.filter((x) => x.aiRescue !== null);
            const keys = [...new Set(rescue.flatMap((x) => Object.keys(x.aiRescue)))].sort();
            out.push(
              `| ${name} | ${won.length}/${games.length} | ${med(games.map((x) => Math.round(x.endTick / 120) / 10))} | 中位數 ${med(lost)}、最多 ${Math.max(...lost)} | ${sum(games.map((x) => x.aiFarmers.hits))}／${sum(games.map((x) => x.aiFarmers.back))} | ${med(games.map((x) => x.aiFarmers.idle))} | ${med(games.map((x) => x.aiFarmers.hiding))} | ${keys.length === 0 ? "—" : keys.map((k) => `${k} ${sum(rescue.map((x) => x.aiRescue[k] ?? 0))}`).join("、")} |`,
            );
          }
          out.push("", "被打：兩分鐘內死 5 名以上村民（之前三分鐘沒算過）；補回：3 分鐘後村民和被打前差 2 名以內。在家閒著：沒有指令、主城 15 格內。中位數；救援紀錄是各局合計。");
          console.log(out.join("\n"));
          EOF
          node harass.mjs | tee -a "${GITHUB_STEP_SUMMARY}"

  # Unit balance (round 3, D-026): small battles of equal cost, the values before this round
  # against the values in the code, every goal marked (src/balance.ts). About 10 seconds.
  # Goals 1-4 must hold with both sides advancing; goal 5 is reported (ceo: not this round).
  balance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Battles of equal cost
        run: |
          set -o pipefail
          node src/balance.ts --check 1,2,3,4,6,7,8,9 | tee -a "${GITHUB_STEP_SUMMARY}"

  # 100 games of the normal AI against the easy one (round 2): the same seeds, styles and swaps;
  # each spawn plays easy half the time. Replayed like the others.
  ai-vs-easy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sim/package-lock.json
      - run: npm ci
      - name: 25 games against the easy AI, each replayed
        run: node src/tournament.ts --games 100 --shard ${{ matrix.shard }} --shards 4 --difficulty normal,easy --out "${GITHUB_WORKSPACE}/tournament-easy/shard-${{ matrix.shard }}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tournament-easy-shard-${{ matrix.shard }}
          path: tournament-easy/
          retention-days: 30

  # The hard AI (D-052), once AI_DIFFICULTIES has it: 100 games against the normal AI (each
  # spawn plays hard half the time, as against easy) and 100 hard against hard, replayed like
  # the others. Until then every step after the check is skipped.
  ai-vs-hard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pair: [hard-normal, hard-hard]
        shard: [0, 1, 2, 3]
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sim/package-lock.json
      - name: Is there a hard AI yet (AI_DIFFICULTIES)?
        id: hard
        run: |
          if node --input-type=module -e 'const m = await import("./src/protocol.ts"); process.exit(m.AI_DIFFICULTIES.includes("hard") ? 0 : 1)' 2>/dev/null; then
            echo "on=true" >> "${GITHUB_OUTPUT}"
          else
            echo "on=false" >> "${GITHUB_OUTPUT}"
            echo "No hard AI in AI_DIFFICULTIES yet: skipped." | tee -a "${GITHUB_STEP_SUMMARY}"
          fi
      - if: steps.hard.outputs.on == 'true'
        run: npm ci
      - name: 25 games, ${{ matrix.pair }}, each replayed
        if: steps.hard.outputs.on == 'true'
        run: |
          pair="${{ matrix.pair }}"
          node src/tournament.ts --games 100 --shard ${{ matrix.shard }} --shards 4 --difficulty "${pair/-/,}" --out "${GITHUB_WORKSPACE}/tournament-${pair}/shard-${{ matrix.shard }}"
      - uses: actions/upload-artifact@v7
        if: always() && steps.hard.outputs.on == 'true'
        with:
          name: tournament-${{ matrix.pair }}-shard-${{ matrix.shard }}
          path: tournament-${{ matrix.pair }}/
          retention-days: 30

  # Gates as for the others; hard against normal: hard wins at least 65% of the decided games
  # (D-052's brief, src/tournament-summary.ts).
  ai-hard-summary:
    needs: [ai-vs-hard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Is there a hard AI yet (AI_DIFFICULTIES)?
        id: hard
        run: |
          if node --input-type=module -e 'const m = await import("./src/protocol.ts"); process.exit(m.AI_DIFFICULTIES.includes("hard") ? 0 : 1)' 2>/dev/null; then
            echo "on=true" >> "${GITHUB_OUTPUT}"
          else
            echo "on=false" >> "${GITHUB_OUTPUT}"
            echo "No hard AI in AI_DIFFICULTIES yet: skipped." | tee -a "${GITHUB_STEP_SUMMARY}"
          fi
      - uses: actions/download-artifact@v7
        if: steps.hard.outputs.on == 'true'
        with:
          pattern: tournament-hard-normal-shard-*
          path: tournament-hard-normal
          merge-multiple: true
      - uses: actions/download-artifact@v7
        if: steps.hard.outputs.on == 'true'
        with:
          pattern: tournament-hard-hard-shard-*
          path: tournament-hard-hard
          merge-multiple: true
      - name: Summary and gates, hard against normal
        if: steps.hard.outputs.on == 'true'
        run: |
          set -o pipefail
          { echo "## 困難對普通"; node src/tournament-summary.ts ../tournament-hard-normal/shard-* --json ../tournament-hard-normal/summary.json; } | tee -a "${GITHUB_STEP_SUMMARY}"
      - name: Summary and gates, hard against hard
        if: always() && steps.hard.outputs.on == 'true'
        run: |
          set -o pipefail
          { echo "## 困難對困難"; node src/tournament-summary.ts ../tournament-hard-hard/shard-* --json ../tournament-hard-hard/summary.json; } | tee -a "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@v7
        if: always() && steps.hard.outputs.on == 'true'
        with:
          name: tournament-summary-hard-normal
          path: tournament-hard-normal/summary.json
          retention-days: 30
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always() && steps.hard.outputs.on == 'true'
        with:
          name: tournament-summary-hard-hard
          path: tournament-hard-hard/summary.json
          retention-days: 30
          if-no-files-found: ignore

  # The same command logs give the same hashes in Node, Chromium and WebKit: three AI-vs-AI
  # games played in Node, replayed in the browser from the simulation's own sources.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Playwright's own image, as client's e2e (#75): the browsers and the system libraries they
    # need are already in it, so nothing comes from the Ubuntu package mirror. Installing them on
    # the runner hung for 15+ minutes when the mirror stalled (2026-10-01) and still ran out of
    # its 12 minutes with apt retrying (#87's run 37025825408, 2026-10-02).
    # The tag is the Playwright version package-lock.json locks (a step below checks it).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    defaults:
      run:
        working-directory: sim
        # In a container steps run in sh unless told otherwise; the replay step uses pipefail.
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: The image has the Playwright that package-lock.json locks
        run: |
          locked=$(node -p 'require("./package-lock.json").packages["node_modules/playwright"].version')
          if [ "$locked" != "1.63.0" ]; then
            echo "::error::package-lock.json locks Playwright $locked; change the container image in sim.yml to v$locked-noble"
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sim/package-lock.json
      - run: npm ci
      - name: Replay Node's games in ${{ matrix.browser }}
        run: |
          set -o pipefail
          { echo "### ${{ matrix.browser }}"; node src/browser-check.ts --browser ${{ matrix.browser }} --games 3; } | tee -a "${GITHUB_STEP_SUMMARY}"

  # Win rate of each spawn within 35-65% (draws left out), draws at most 10% (D5).
  # For now draws may reach 25% (ceo 2026-09-30, see src/tournament-summary.ts) until a
  # later round brings them back to 10%. Against the easy AI, normal also wins at least 80%
  # of the decided games.
  ai-summary:
    needs: [ai-vs-ai, ai-vs-easy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/download-artifact@v7
        with:
          pattern: tournament-shard-*
          path: tournament
          merge-multiple: true
      - uses: actions/download-artifact@v7
        with:
          pattern: tournament-easy-shard-*
          path: tournament-easy
          merge-multiple: true
      - name: Summary and gates
        run: |
          set -o pipefail
          node src/tournament-summary.ts ../tournament/shard-* --json ../tournament/summary.json | tee -a "${GITHUB_STEP_SUMMARY}"
      - name: Summary and gates, normal against easy
        if: always()
        run: |
          set -o pipefail
          { echo "## 普通對簡單"; node src/tournament-summary.ts ../tournament-easy/shard-* --json ../tournament-easy/summary.json; } | tee -a "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tournament-summary
          path: tournament/summary.json
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tournament-summary-easy
          path: tournament-easy/summary.json
          retention-days: 30

  # Random maps (D-074): by layout. Gates (D-076): replays and the spawn win rate, each pair.
  ai-random-summary:
    needs: [ai-vs-ai-random]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/download-artifact@v7
        with:
          pattern: tournament-random-*-shard-*
          path: tournament-random
          merge-multiple: true
      - name: Summary, random maps
        run: |
          set -o pipefail
          ok=0
          for pair in normal-normal hard-hard hard-normal normal-easy; do
            { echo "## 隨機地圖：${pair}"; node src/tournament-summary.ts ../tournament-random/${pair}/shard-* --json ../tournament-random/summary-${pair}.json; } | tee -a "${GITHUB_STEP_SUMMARY}" || ok=1
          done
          exit $ok
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tournament-random-summary
          path: tournament-random/summary-*.json
          retention-days: 30
