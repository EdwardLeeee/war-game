name: Sim

# Game rules and the prototype's simple AI (sim/, war-game-core). Not a required check:
# the path filter would leave unrelated pull requests waiting.
on:
  push:
    branches: ["core/**", "ai/scratch-*"]
    paths:
      - "sim/**"
      - ".github/workflows/sim.yml"
  pull_request:
    paths:
      - "sim/**"
      - ".github/workflows/sim.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripted:
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/core/scratch-') || startsWith(github.ref, 'refs/heads/ai/scratch-')
    name: scripted (${{ matrix.difficulty == 'hard' && 'hard ' || '' }}${{ matrix.cell.group }} ${{ matrix.cell.seeds }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Against the normal AI, and the hard one once AI_DIFFICULTIES has it (D-052).
        difficulty: [normal, hard]
        cell:
          - { group: push, seeds: 1-40, args: --strategy push --speed h1 --formation close }
          # Round 6 (D-054): the same push, taking town after town as the user does.
          - { group: push-corners, seeds: 1-40, args: --strategy push --speed h1 --formation close --corners }
          # Round 6 (D-054): the same push, its soldiers left to automatic training.
          - { group: push-auto, seeds: 1-40, args: --strategy push --speed h1 --formation close --auto-train }
          # Round 7 (D-061): automatic training and taking town after town together, and taking
          # town after town but governing every one (governing has to be worth it).
          - { group: push-auto-corners, seeds: 1-40, args: --strategy push --speed h1 --formation close --auto-train --corners }
          - { group: push-corners-govern, seeds: 1-40, args: --strategy push --speed h1 --formation close --corners --govern }
          # Round 8 (D-069): the other pushes governing every town they take, too.
          - { group: push-govern, seeds: 1-40, args: --strategy push --speed h1 --formation close --govern }
          - { group: push-auto-govern, seeds: 1-40, args: --strategy push --speed h1 --formation close --auto-train --govern }
          - { group: push-auto-corners-govern, seeds: 1-40, args: --strategy push --speed h1 --formation close --auto-train --corners --govern }
          # Round 7 (D-061): a cavalry rush, 4 raiders at the AI's farmers before the push.
          - { group: push-raid, seeds: 1-40, args: --strategy push --speed h1 --formation close --raid 4 }
          # D-072: the user's race past hard's army to its main city (their economy, their way, waiting
          # halfway until hard's army is seen coming); the measure for war-game-ai's fixes to hard.
          - { group: push-race, seeds: 1-40, args: --strategy push --speed h1 --formation close --user-eco --race edge --race-stage --race-at 99 --race-by 11.5 }
          # D-080: a tower rush, an outpost manned by 6 spearmen and 2 arrow towers beside the AI's
          # main city, then the push; whether the AI pulls them down is war-game-ai's measure.
          - { group: push-towerrush, seeds: 1-40, args: --strategy push --speed h1 --formation close --tower-rush 6 }
          # D-080 (ceo 2026-10-09): the same rush with its 4 farmers alone, no escort, nobody posted;
          # the army plays the push. The AI left farmers alone (war-game-ai): its acceptance group.
          - { group: push-towerrush-farmers, seeds: 1-40, args: --strategy push --speed h1 --formation close --tower-rush-farmers }
          # D-081 (the user's game f1fd2a87): from minute 12 an outpost manned by 6 spearmen and 5 arrow
          # towers 37 cells from home on the way to the AI's main city, then the push; how many the AI
          # loses by them and how often it bashes on them is war-game-ai's measure.
          - { group: push-fortress, seeds: 1-40, args: --strategy push --speed h1 --formation close --fortress }
          - { group: push-fortress-random, seeds: 1-20, args: --strategy push --speed h1 --formation close --fortress --map random }
          - { group: push-fortress-random, seeds: 21-40, args: --strategy push --speed h1 --formation close --fortress --map random }
          # D-081 (ceo 2026-10-10, as the user in f1fd2a87): the army also holds by the fortress until it is
          # 60 strong or minute 30, then the push.
          - { group: push-fortress-hold, seeds: 1-40, args: --strategy push --speed h1 --formation close --fortress-hold 60 }
          - { group: push-fortress-hold-random, seeds: 1-20, args: --strategy push --speed h1 --formation close --fortress-hold 60 --map random }
          - { group: push-fortress-hold-random, seeds: 21-40, args: --strategy push --speed h1 --formation close --fortress-hold 60 --map random }
          - { group: defend, seeds: 1-20, args: --strategy defend --speed h1 --formation close }
          - { group: defend, seeds: 21-40, args: --strategy defend --speed h1 --formation close }
          - { group: defend-loose, seeds: 1-20, args: --strategy defend --speed h1 --formation all }
          - { group: defend-loose, seeds: 21-40, args: --strategy defend --speed h1 --formation all }
          - { group: defend-eco, seeds: 1-14, args: --strategy defend --speed eco --formation all }
          - { group: defend-eco, seeds: 15-27, args: --strategy defend --speed eco --formation all }
          - { group: defend-eco, seeds: 28-40, args: --strategy defend --speed eco --formation all }
          - { group: notown, seeds: 1-40, args: --strategy notown --speed h1 --formation close }
          # D-074: the push on random maps; the player and the AI both scout.
          - { group: push-random, seeds: 1-20, args: --strategy push --speed h1 --formation close --map random }
          - { group: push-random, seeds: 21-40, args: --strategy push --speed h1 --formation close --map random }
          # D-097 (war-game-ai): the push with cavalry, about 2 for every 9 foot (the triangle and
          # cavalry riding for the back row, CAV_FLANK); war-game-ai's measure for hard's cavalry.
          - { group: push-cavalry, seeds: 1-40, args: --strategy push --speed h1 --formation close --cavalry-share 18 }
          - { group: push-cavalry-random, seeds: 1-20, args: --strategy push --speed h1 --formation close --cavalry-share 18 --map random }
          - { group: push-cavalry-random, seeds: 21-40, args: --strategy push --speed h1 --formation close --cavalry-share 18 --map random }
    env:
      # scripted-<group>-<seeds> against normal (as before), scripted-hard-<group>-<seeds> against hard.
      NAME: scripted-${{ matrix.difficulty == 'hard' && 'hard-' || '' }}${{ matrix.cell.group }}-${{ matrix.cell.seeds }}
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Is there a hard AI yet (AI_DIFFICULTIES)?
        id: hard
        if: matrix.difficulty == 'hard'
        run: |
          if node --input-type=module -e 'const m = await import("./src/protocol.ts"); process.exit(m.AI_DIFFICULTIES.includes("hard") ? 0 : 1)' 2>/dev/null; then
            echo "on=true" >> "${GITHUB_OUTPUT}"
          else
            echo "on=false" >> "${GITHUB_OUTPUT}"
            echo "No hard AI in AI_DIFFICULTIES yet: skipped." | tee -a "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Scripted player against the ${{ matrix.difficulty }} AI
        if: matrix.difficulty == 'normal' || steps.hard.outputs.on == 'true'
        run: |
          set -o pipefail
          node src/scripted-games.ts --seeds ${{ matrix.cell.seeds }} ${{ matrix.cell.args }} --difficulty ${{ matrix.difficulty }} --json "${NAME}.json" | tee -a "${GITHUB_STEP_SUMMARY}"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}
          path: sim/${{ env.NAME }}.json
          retention-days: 30
          if-no-files-found: ignore

  scripted-summary:
    needs: [scripted]
    if: always() && (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/core/scratch-') || startsWith(github.ref, 'refs/heads/ai/scratch-'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/download-artifact@v7
        with:
          pattern: scripted-*
          path: scripted
          merge-multiple: true
      - name: The five groups
        run: |
          set -o pipefail
          cat > summary.mjs <<'EOF'
          import { readdirSync, readFileSync } from "node:fs";
          const groups = [["push", "主動", 20], ["push-corners", "主動（一直搶城鎮）", 20], ["push-auto", "主動（自動訓練）", 20], ["push-auto-corners", "主動（自動訓練＋一直搶城鎮）", 20], ["push-corners-govern", "主動（一直搶城鎮，打下來就治理）", 20], ["push-govern", "主動（打下來就治理）", 20], ["push-auto-govern", "主動（自動訓練，打下來就治理）", 20], ["push-auto-corners-govern", "主動（自動訓練＋一直搶城鎮，打下來就治理）", 20], ["push-raid", "主動（騎兵突襲）", 20], ["push-race", "主動（偷家）", 20], ["push-towerrush", "主動（塔攻，護送）", 20], ["push-towerrush-farmers", "主動（塔攻，只派村民）", 20], ["push-fortress", "主動（半路要塞）", 20], ["push-fortress-random", "主動（半路要塞），隨機地圖", 20], ["push-fortress-hold", "主動（半路要塞，大軍守著）", 20], ["push-fortress-hold-random", "主動（半路要塞，大軍守著），隨機地圖", 20], ["defend", "守家", 15], ["defend-loose", "守家散開", 15], ["defend-eco", "守家經濟養大散開", 15], ["notown", "不拿城鎮", 15], ["push-random", "主動，隨機地圖", 20], ["push-cavalry", "主動（帶騎兵）", 20], ["push-cavalry-random", "主動（帶騎兵），隨機地圖", 20]];
          // scripted-<group>-<seeds>.json against normal, scripted-hard-<group>-<seeds>.json against hard.
          const levels = [["", "普通"], ["hard-", "困難"]];
          const games = new Map(levels.flatMap(([l]) => groups.map(([g]) => [l + g, []])));
          for (const f of readdirSync("scripted")) {
            const m = /^scripted-(.+)-\d+-\d+\.json$/.exec(f);
            if (m && games.has(m[1])) games.get(m[1]).push(...JSON.parse(readFileSync(`scripted/${f}`, "utf8")).games);
          }
          const cell = (list) => {
            const won = list.filter((x) => x.result === "won").length;
            const open = list.filter((x) => x.result === "open").length;
            return `${won}/${list.length}${open > 0 ? `（${open}）` : ""}`;
          };
          const out = [];
          for (const [l, level] of levels) {
            if (groups.every(([g]) => games.get(l + g).length === 0)) continue;
            out.push(`## 腳本玩家五組（對${level}電腦）`, "", "| 組 | 前 15／20 局 | 40 局 |", "|---|---|---|");
            for (const [g, name, first] of groups) {
              const list = games.get(l + g).sort((a, b) => a.seed - b.seed);
              out.push(`| ${name}（${g}） | ${cell(list.filter((x) => x.seed <= first))} | ${cell(list)} |`);
            }
            out.push("");
          }
          out.push("贏/局數；括號是到第 50 分還沒分出勝負的局。前 15／20 局是 D-049 以前 CI 跑的局，逐局相同。");
          console.log(out.join("\n"));
          EOF
          node summary.mjs | tee -a "${GITHUB_STEP_SUMMARY}"
