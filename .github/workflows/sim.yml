name: Sim

# Game rules and the prototype's simple AI (sim/, war-game-core). Not a required check:
# the path filter would leave unrelated pull requests waiting.
on:
  push:
    branches: ["core/**", "ai/scratch-*"]
    paths:
      - "sim/**"
      - ".github/workflows/sim.yml"
  pull_request:
    paths:
      - "sim/**"
      - ".github/workflows/sim.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sim-${{ github.ref }}
  cancel-in-progress: true

env:
  # AI-against-AI games' time limit (D-112, D-115; the user 2026-10-31: 「我覺得你對打不應該只限制60分鐘」): 120 minutes,
  # its draws gated; the summaries list the old 30 and 60 minutes for reference. The scripted groups' too (--cap).
  AI_TICKS: "144000"

jobs:
  scripted-late-siege:
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/core/scratch-') || startsWith(github.ref, 'refs/heads/ai/scratch-')
    name: scripted late siege (${{ matrix.cell.group }} ${{ matrix.cell.seeds }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cell:
          - { group: push-late-siege-t45, seeds: 1-10, args: --strategy push --speed h1 --formation close --late-siege --cap 120 --takeover 45 }
          - { group: push-late-siege-t45, seeds: 11-20, args: --strategy push --speed h1 --formation close --late-siege --cap 120 --takeover 45 }
          - { group: push-late-siege-t45, seeds: 21-30, args: --strategy push --speed h1 --formation close --late-siege --cap 120 --takeover 45 }
          - { group: push-late-siege-t45, seeds: 31-40, args: --strategy push --speed h1 --formation close --late-siege --cap 120 --takeover 45 }
          - { group: push-late-siege-random-t45, seeds: 1-10, args: --strategy push --speed h1 --formation close --late-siege --cap 120 --takeover 45 --map random }
          - { group: push-late-siege-random-t45, seeds: 11-20, args: --strategy push --speed h1 --formation close --late-siege --cap 120 --takeover 45 --map random }
          - { group: push-late-siege-random-t45, seeds: 21-30, args: --strategy push --speed h1 --formation close --late-siege --cap 120 --takeover 45 --map random }
          - { group: push-late-siege-random-t45, seeds: 31-40, args: --strategy push --speed h1 --formation close --late-siege --cap 120 --takeover 45 --map random }
          - { group: push-late-siege-t60, seeds: 1-10, args: --strategy push --speed h1 --formation close --late-siege --cap 120 --takeover 60 }
          - { group: push-late-siege-t60, seeds: 11-20, args: --strategy push --speed h1 --formation close --late-siege --cap 120 --takeover 60 }
          - { group: push-late-siege-t60, seeds: 21-30, args: --strategy push --speed h1 --formation close --late-siege --cap 120 --takeover 60 }
          - { group: push-late-siege-t60, seeds: 31-40, args: --strategy push --speed h1 --formation close --late-siege --cap 120 --takeover 60 }
          - { group: push-late-siege-random-t60, seeds: 1-10, args: --strategy push --speed h1 --formation close --late-siege --cap 120 --takeover 60 --map random }
          - { group: push-late-siege-random-t60, seeds: 11-20, args: --strategy push --speed h1 --formation close --late-siege --cap 120 --takeover 60 --map random }
          - { group: push-late-siege-random-t60, seeds: 21-30, args: --strategy push --speed h1 --formation close --late-siege --cap 120 --takeover 60 --map random }
          - { group: push-late-siege-random-t60, seeds: 31-40, args: --strategy push --speed h1 --formation close --late-siege --cap 120 --takeover 60 --map random }
    env:
      NAME: siege-hard-${{ matrix.cell.group }}-${{ matrix.cell.seeds }}
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Scripted player (late siege) against the hard AI
        run: |
          set -o pipefail
          node src/scripted-games.ts --seeds ${{ matrix.cell.seeds }} ${{ matrix.cell.args }} --difficulty hard --json "${NAME}.json" | tee -a "${GITHUB_STEP_SUMMARY}"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}
          path: sim/${{ env.NAME }}.json
          retention-days: 30
          if-no-files-found: ignore
