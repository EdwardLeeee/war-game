# D-147 PR B (ceo 2026-11-24; docs/research/2026-11-train-chain-handback.md, C): the training chain taken over after it
# stopped only because the runners were taken (another workflow's job waiting, none free, or the segment gave way). Started
# only by .github/ai-train/dispatch.py, and only when the environment ai-train-wait is there with a wait timer (the user
# decides whether to make it; without it no run of this workflow is ever started, so nothing names the environment: a run
# naming a missing environment creates it). The job waits on that timer holding no runner, then decides again as the
# dispatcher does: a segment, another wait run, or nothing (the switch, the caps and the pauses as always).
# Cancelling a wait run pauses the chain until the user says to go on (AI_TRAIN_RESUME), as cancelling a segment does.
name: AI train wait
run-name: "AI train: wait"

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# One at a time (the dispatcher starts none while one waits): never replaced, so a cancel is always someone's.
concurrency:
  group: ai-train-wait
  cancel-in-progress: false

jobs:
  wait:
    if: github.repository == 'EdwardLeeee/war-game' && vars.AI_TRAIN == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ai-train-wait
      deployment: false
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/ai-train
          persist-credentials: false
      - name: Decide and dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REPO_ID: ${{ github.repository_id }}
          REF: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          MODE: wait
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          AI_TRAIN: ${{ vars.AI_TRAIN }}
          AI_TRAIN_RESUME: ${{ vars.AI_TRAIN_RESUME }}
        run: python3 .github/ai-train/dispatch.py
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-train-ledger
          path: ledger/
          retention-days: 90
          if-no-files-found: ignore
