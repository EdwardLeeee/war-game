# D-147 PR B (ceo 2026-11-24; docs/research/2026-11-train-chain-handback.md, C): the training chain taken over after it
# stopped only because the runners were taken (another workflow's job waiting, none free, or the segment gave way). Started
# only by .github/ai-train/dispatch.py, and only when the environment ai-train-wait is there with a wait timer (the user
# decides whether to make it; without it no run of this workflow is ever started, so nothing names the environment: a run
# naming a missing environment creates it). The job waits on that timer holding no runner, then does one thing: it starts
# AI train's dispatcher (mode=dispatch, on main), which decides as always (a segment, another wait run, or nothing; the
# switch, the caps and the pauses). It never starts a segment itself, reads nothing and takes no input.
# Cancelling a wait run pauses the chain until the user says to go on (AI_TRAIN_RESUME), as cancelling a segment does.
name: AI train wait
run-name: "AI train: wait"

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# One at a time (the dispatcher starts none while one waits): never replaced, so a cancel is always someone's.
concurrency:
  group: ai-train-wait
  cancel-in-progress: false

jobs:
  wait:
    # As the dispatch job of ai-train.yml: this repository, the switch on, a run the dispatcher started (github-actions[bot],
    # also as triggering actor: not by hand), its first attempt (a Re-run does nothing), on main.
    if: >-
      github.repository == 'EdwardLeeee/war-game' && vars.AI_TRAIN == 'on' &&
      github.actor == 'github-actions[bot]' && github.triggering_actor == 'github-actions[bot]' &&
      github.run_attempt == '1' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: ai-train-wait
      deployment: false
    # The only write: starting a workflow run (actions: write), as the dispatch job has; no secret, no checkout.
    permissions:
      actions: write
    steps:
      - name: Start the dispatcher
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ai-train.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode=dispatch
