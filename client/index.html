<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <!-- Safari ignores user-scalable=no; the canvas blocks browser zoom with touch-action: none. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>war-game 原型</title>
    <!-- Add to Home Screen opens it without the browser's address bar (D-042). The name and
         icon are temporary (GDD section 16). No service worker: nothing is cached, so a new
         deployment is never hidden behind an old copy (version.json tells the page instead). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1d2320" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <!-- Safari before iOS 26 opens a Home Screen site as a web app only with the manifest's
         display or this; landscape iPhones hide the status bar, so the page may run under it. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="war-game" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="stage"></div>
    <div id="hud"></div>

    <section id="start" class="screen" aria-labelledby="start-title">
      <div class="card">
        <h1 id="start-title">war-game 原型</h1>
        <p class="mode">1 對 1 對電腦</p>
        <div class="difficulty" role="radiogroup" aria-labelledby="difficulty-label">
          <span id="difficulty-label">難度</span>
          <button type="button" role="radio" data-difficulty="easy" aria-checked="true">簡單</button>
          <button type="button" role="radio" data-difficulty="normal" aria-checked="false" class="secondary">普通</button>
          <button type="button" role="radio" data-difficulty="hard" aria-checked="false" class="secondary">困難</button>
        </div>
        <div class="difficulty map-mode" role="radiogroup" aria-labelledby="map-label">
          <span id="map-label">地圖</span>
          <button type="button" role="radio" data-map="fixed" aria-checked="true">固定地圖</button>
          <button type="button" role="radio" data-map="random" aria-checked="false" class="secondary">隨機地圖</button>
        </div>
        <p id="map-note" class="note map-note">每局同一張，適合比較電腦強弱</p>
        <div class="difficulty culture" role="radiogroup" aria-labelledby="culture-label">
          <span id="culture-label">你的陸</span>
          <button type="button" role="radio" data-culture="e" aria-checked="true">東陸</button>
          <button type="button" role="radio" data-culture="w" aria-checked="false" class="secondary">西陸</button>
        </div>
        <p id="difficulty-note" class="note" hidden>改了難度、地圖或陸，要按「重來」才會用在新的一局。</p>
        <div id="start-buttons" class="start-buttons">
          <button id="start-game" type="button">開始</button>
          <button id="restart-game" class="secondary" type="button" hidden>重來</button>
          <button id="continue-last" class="secondary" type="button" hidden>繼續上一局</button>
        </div>
        <div id="continue-progress" class="continue-progress" hidden>
          <span id="continue-progress-text"></span>
          <progress id="continue-bar" max="1" value="0"></progress>
          <button id="continue-cancel" class="secondary" type="button">取消</button>
        </div>
        <p id="continue-note" class="note continue-note" role="status" hidden></p>
        <p id="measure-note" class="note continue-note" role="status" hidden></p>
        <div id="update" class="update" role="status" hidden>
          <span>有新版本</span>
          <button id="update-now" type="button">更新</button>
        </div>
        <p id="about-note" class="note">對局沒有時間上限，打到一方的主城被摧毀或投降為止。</p>
        <p class="small"><span id="commit"></span> · <span id="record-code"></span> · <a href="../">回測試頁首頁</a></p>
      </div>
    </section>

    <p id="error" role="alert" hidden></p>
    <div id="proto-label">原型介面（非正式設計）</div>
    <div id="rotate" role="alert">
      <div class="phone" aria-hidden="true"></div>
      <p>請轉成橫向</p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
